'use strict';

const Ordenes = (() => {
  const MAX_ITEMS = 15;
  const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const nombreTipo = (t) => (t === 'COMPRA' ? 'Orden de Compra' : 'Orden de Servicio');
  const conNumero = (o) => `${nombreTipo(o.tipo)}${o.numero ? ' N° ' + o.numero : ' (sin número)'}`;

  function calcular(items, ivaPct, descuento) {
    const filas = items.map((it) => {
      const cant = fmt.aNumero(it.cantidad) || 0;
      const precio = fmt.aNumero(it.precio_unitario) || 0;
      const sub = r2(cant * precio);
      const iva = it.exento ? 0 : r2(sub * ivaPct / 100);
      return { sub, iva, total: r2(sub + iva), exento: it.exento };
    });
    const subtotal = r2(filas.filter((f) => !f.exento).reduce((a, f) => a + f.sub, 0));
    const exento = r2(filas.filter((f) => f.exento).reduce((a, f) => a + f.sub, 0));
    const iva = r2(filas.reduce((a, f) => a + f.iva, 0));
    const general = r2(subtotal + iva + exento);
    const d = Math.min(Math.max(fmt.aNumero(descuento) || 0, 0), 100);
    return { filas, subtotal, exento, iva, general, final: r2(general - general * d / 100) };
  }

  async function render(cont, p) {
    const filtros = { tipo: p.tipo || '', estado: p.estado || '', anio: p.anio !== undefined ? p.anio : new Date().getFullYear(), mes: p.mes || '', texto: p.texto || '', pagina: 1, por_pagina: 100 };
    const editar = App.puede('oc.editar');
    cont.innerHTML = `
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <h1 class="titulo-pagina mr-auto">Órdenes de Compra y de Servicio</h1>
        ${editar ? `<button class="btn btn-prim" id="btn-manual">${ico('plus')} Agregar manualmente</button>` : ''}
      </div>
      <div class="tarjeta p-3 mb-3 flex flex-wrap gap-2 items-center">
        <select id="f-tipo" class="campo" style="width:auto" aria-label="Tipo">${ui.opciones([{ valor: 'COMPRA', texto: 'Compras' }, { valor: 'SERVICIO', texto: 'Servicios' }], filtros.tipo, 'Compras y servicios')}</select>
        ${ui.selectorPeriodo(filtros.anio, filtros.mes)}
        <select id="f-estado" class="campo" style="width:auto" aria-label="Estado">${ui.opciones([{ valor: 'ACTIVA', texto: 'Activas' }, { valor: 'ANULADA', texto: 'Anuladas' }], filtros.estado, 'Todos los estados')}</select>
        <input id="f-texto" class="campo flex-1 min-w-[200px]" placeholder="Buscar proveedor, concepto, N° de proceso…" value="${esc(filtros.texto)}" aria-label="Buscar">
      </div>
      <div class="tarjeta"><div id="tabla" class="tabla-env"></div><div id="pag"></div></div>`;
    const aplicar = () => {
      Object.assign(filtros, { tipo: $('#f-tipo').value, anio: $('#f-anio').value, mes: $('#f-mes').value, estado: $('#f-estado').value, texto: $('#f-texto').value.trim(), pagina: 1 });
      cargar();
    };
    ['#f-tipo', '#f-anio', '#f-mes', '#f-estado'].forEach((s) => $(s).addEventListener('change', aplicar));
    $('#f-texto').addEventListener('input', demorar(aplicar, 450));
    if ($('#btn-manual', cont)) $('#btn-manual', cont).addEventListener('click', async () => { const tipo = await elegirTipo(true); if (tipo) formulario({ tipo }, cargar); });

    async function cargar() {
      const tabla = $('#tabla');
      tabla.innerHTML = '<div class="suave p-6">Cargando…</div>';
      try {
        const r = await api('oc.listar', filtros);
        if (!r.registros.length) { tabla.innerHTML = '<div class="suave p-6">No hay órdenes con esos filtros.</div>'; $('#pag').innerHTML = ''; return; }
        tabla.innerHTML = `<table class="tabla"><thead><tr><th>Orden</th><th>Registrada</th><th>Fecha de la orden</th><th>Proveedor</th><th class="hidden lg:table-cell">Concepto</th><th class="num">Total</th><th>Pagos</th><th class="text-right">Acciones</th></tr></thead><tbody>
          ${r.registros.map((o) => `<tr class="${o.estado === 'ANULADA' ? 'anulada' : ''}">
            <td class="whitespace-nowrap"><span class="pill ${o.tipo === 'COMPRA' ? 'pill-info' : 'pill-ok'}">${o.tipo === 'COMPRA' ? 'OC · Compra' : 'OS · Servicio'}</span> ${o.numero ? `<strong>N° ${o.numero}</strong>` : '<span class="suave text-xs">sin número</span>'}</td>
            <td class="whitespace-nowrap text-xs" title="${esc(o.registrada_por || '')}">${fmt.fechaHora(o.registrada_en)}</td>
            <td class="whitespace-nowrap">${o.fecha ? fmt.fecha(o.fecha) : '<span class="suave text-xs">en blanco</span>'}</td>
            <td><div class="font-medium">${esc(o.beneficiario)}</div><div class="suave text-xs">${esc(fmt.doc(o.tipo_doc, o.documento))} · ${esc(o.unidad_solicitante || '')}</div></td>
            <td class="hidden lg:table-cell text-xs" style="max-width:280px">${esc((o.concepto || '').slice(0, 120))}</td>
            <td class="num whitespace-nowrap">${fmt.bs(o.total_final)}<div class="suave text-xs">${fmt.usd(o.monto_divisa)}</div></td>
            <td class="text-xs">${o.pagos.length ? 'OP ' + o.pagos.join(', ') : '<span class="suave">—</span>'}</td>
            <td class="acciones text-right whitespace-nowrap">
              ${o.estado !== 'ANULADA' && editar ? `<button class="btn btn-ico" data-acc="editar" data-id="${o.id}" title="Editar" aria-label="Editar ${esc(conNumero(o))}">${ico('pencil')}</button>` : ''}
              <button class="btn btn-ico" data-acc="ver" data-id="${o.id}" title="Ver e imprimir" aria-label="Ver ${esc(conNumero(o))}">${ico('printer')}</button>
              ${o.estado !== 'ANULADA' && App.puede('oc.anular') ? `<button class="btn btn-ico" data-acc="anular" data-id="${o.id}" title="Anular" aria-label="Anular ${esc(conNumero(o))}">${ico('ban')}</button>` : ''}
            </td></tr>`).join('')}</tbody></table>
          <div class="p-3 text-sm font-semibold">Total activo en el filtro: ${fmt.bs(r.monto_total)}</div>`;
        $('#pag').replaceChildren(ui.paginacion(r.total, r.pagina, r.por_pagina, (n) => { filtros.pagina = n; cargar(); }));
        $$('[data-acc]', tabla).forEach((b) => b.addEventListener('click', () => accion(b.dataset.acc, r.registros.find((o) => o.id === b.dataset.id), cargar)));
        ui.iconos();
      } catch (e) { tabla.innerHTML = `<div class="alerta alerta-peligro m-3">${esc(e.message)}</div>`; }
    }
    await cargar();
    if (p.desdePago && editar) {
      history.replaceState(null, '', '#/ordenes');
      const tipo = await elegirTipo();
      if (tipo) formulario(await api('oc.prellenarDesdePago', { pago_id: p.desdePago, tipo }), cargar);
    }
  }

  function elegirTipo(manual) {
    return new Promise((ok) => {
      let elegido = null;
      const m = ui.modal({
        titulo: '¿Qué orden desea crear?',
        cuerpo: `<p class="mb-3">${manual ? 'Registro manual desde el expediente. La fecha y el número pueden quedar en blanco para escribirlos a mano después de imprimir.' : 'Se copiarán el proveedor y el concepto del pago, y la orden quedará vinculada a él.'}</p>
          <div class="flex gap-2"><button class="btn flex-1" data-t="COMPRA">${ico('shopping-cart')} Orden de Compra (OC)</button><button class="btn btn-prim flex-1" data-t="SERVICIO">${ico('wrench')} Orden de Servicio (OS)</button></div>`,
        alCerrar: () => ok(elegido)
      });
      $$('[data-t]', m.el).forEach((b) => b.addEventListener('click', () => { elegido = b.dataset.t; m.cerrar(); }));
      ui.iconos();
    });
  }

  async function accion(acc, o, recargar) {
    try {
      if (acc === 'editar') return formulario((await api('oc.obtener', { id: o.id })).orden, recargar);
      if (acc === 'ver') {
        const v = await api('oc.vista', { id: o.id });
        return ui.documento({ titulo: v.titulo, html: v.html, pdfUrl: v.pdf_url, generarPdf: App.puede('oc.editar') && o.estado !== 'ANULADA' ? async () => { const r = await api('oc.pdf', { id: o.id }, { escritura: true }); recargar(); return r; } : null });
      }
      if (acc === 'anular') {
        const motivo = await ui.confirmar({ titulo: `Anular ${conNumero(o)}`, mensaje: 'La orden quedará anulada (no se borra).', textoBoton: 'Anular', peligro: true, pedirMotivo: true });
        if (!motivo) return null;
        await api('oc.anular', { id: o.id, motivo }, { escritura: true });
        ui.toast('Orden anulada.', 'exito');
        return recargar();
      }
    } catch (e) { ui.error(e); }
    return null;
  }

  function formulario(orden, recargar) {
    const clave = 'oc:' + (orden.id || 'nueva-' + orden.tipo + (orden.pago_id ? '-' + orden.pago_id : ''));
    const previo = borrador.leer(clave);
    const d = Object.assign({ fecha: '', tipo_pago: 'TRANSFERENCIA', condicion: 'DE CONTADO', descuento_pct: 0, items: [{}], imputacion: [], moneda: 'BOLÍVARES (Bs)', lugar_compra: App.estado.catalogos.institucion.lugar_compra }, orden, previo || {});
    const cat = App.estado.catalogos;
    const imp = [0, 1, 2].map((i) => (d.imputacion || [])[i] || {});
    const titulo = orden.id ? conNumero(d) : `Nueva ${nombreTipo(d.tipo).toLowerCase()} (registro manual)`;
    const m = ui.modal({
      titulo, tamano: 'grande',
      cuerpo: `
        ${previo ? '<div class="alerta alerta-info mb-3">Se recuperó un borrador sin guardar.</div>' : ''}
        ${d.pago_id ? `<div class="alerta alerta-ok mb-3">Quedará vinculada al pago N° ${esc(d.pago_numero || '')}.</div>` : ''}
        <form id="form-oc" class="space-y-4" novalidate>
          <div class="flex flex-wrap items-center gap-3 p-3 rounded-lg" style="background:var(--superficie-2)">
            <span class="font-semibold">Tipo:</span>
            <label class="check"><input type="radio" name="oc-tipo" value="COMPRA" ${d.tipo === 'COMPRA' ? 'checked' : ''} ${orden.id ? 'disabled' : ''}><span><strong>Orden de Compra (OC)</strong></span></label>
            <label class="check"><input type="radio" name="oc-tipo" value="SERVICIO" ${d.tipo !== 'COMPRA' ? 'checked' : ''} ${orden.id ? 'disabled' : ''}><span><strong>Orden de Servicio (OS)</strong></span></label>
            <span class="suave text-xs ml-auto">Fecha y número pueden quedar en blanco: se escriben a mano después de imprimir.</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
            <div><label class="etiqueta" for="oc-num">N° de orden (opcional)</label><input id="oc-num" class="campo num" inputmode="numeric" value="${esc(d.numero || '')}" placeholder="En blanco"></div>
            <div><label class="etiqueta" for="oc-fecha">Fecha (opcional)</label><input id="oc-fecha" type="date" class="campo" value="${esc(d.fecha || '')}"></div>
            <div><label class="etiqueta" for="oc-req">N° de requisición</label><input id="oc-req" class="campo" maxlength="40" value="${esc(d.requisicion || '')}"></div>
            <div class="sm:col-span-2"><label class="etiqueta" for="oc-proc">Número de proceso</label><input id="oc-proc" class="campo" maxlength="60" value="${esc(d.numero_proceso || '')}" placeholder="AMBG-UC-CD-0000-${new Date().getFullYear()}"></div>
            <div class="sm:col-span-2"><label class="etiqueta" for="oc-ben">Proveedor o beneficiario</label><input id="oc-ben" class="campo" maxlength="200" value="${esc(d.beneficiario || '')}" placeholder="Escriba nombre o cédula/RIF para buscar…"></div>
            <div><label class="etiqueta" for="oc-tipodoc">Tipo</label><select id="oc-tipodoc" class="campo">${ui.opciones(['J', 'G', 'V', 'E', 'P'], d.tipo_doc, '—')}</select></div>
            <div><label class="etiqueta" for="oc-doc">R.I.F. / C.I.</label><input id="oc-doc" class="campo" inputmode="numeric" value="${esc(d.documento || '')}"><p id="oc-doc-ayuda" class="ayuda"></p></div>
            <div class="sm:col-span-2"><label class="etiqueta" for="oc-unidad">Unidad solicitante</label>
              <input id="oc-unidad" class="campo" list="lista-unidades" value="${esc(d.unidad_solicitante || '')}"><datalist id="lista-unidades">${cat.unidades.map((u) => `<option value="${esc(u)}">`).join('')}</datalist></div>
            <div><label class="etiqueta" for="oc-tpago">Tipo de pago</label><input id="oc-tpago" class="campo" list="lista-tpago" value="${esc(d.tipo_pago)}"><datalist id="lista-tpago"><option value="TRANSFERENCIA"><option value="CHEQUE"><option value="EFECTIVO"></datalist></div>
            <div><label class="etiqueta" for="oc-cond">Condición</label><input id="oc-cond" class="campo" list="lista-cond" value="${esc(d.condicion)}"><datalist id="lista-cond"><option value="DE CONTADO"><option value="CRÉDITO"><option value="ANTICIPO"></datalist></div>
            <div><label class="etiqueta" for="oc-femi">Fecha de emisión</label><input id="oc-femi" type="date" class="campo" value="${esc(d.fecha_emision || '')}"></div>
            <div class="sm:col-span-3"><label class="etiqueta" for="oc-conc">Concepto</label><textarea id="oc-conc" class="campo" maxlength="1500">${esc(d.concepto || '')}</textarea></div>
          </div>
          <fieldset>
            <legend class="font-semibold mb-2">Desglose (máximo ${MAX_ITEMS} ítems)</legend>
            <div class="tabla-env"><table class="tabla"><thead><tr><th style="min-width:260px">Descripción del ítem</th><th style="width:90px">Cantidad</th><th style="width:140px">Precio unitario</th><th>Exento IVA</th><th class="num">Sub-total</th><th class="num">IVA</th><th class="num">Total</th><th></th></tr></thead>
              <tbody id="items"></tbody></table></div>
            <button type="button" class="btn btn-chico mt-2" id="add-item">${ico('plus')} Agregar ítem</button>
          </fieldset>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="lg:col-span-2 space-y-3">
              <div><label class="etiqueta" for="oc-obs">Observaciones</label><textarea id="oc-obs" class="campo" maxlength="600">${esc(d.observaciones || '')}</textarea></div>
              <details ${imp.some((l) => l.partida) ? 'open' : ''}><summary class="font-semibold cursor-pointer">Imputación presupuestaria</summary>
                <div class="flex flex-wrap gap-4 my-2">${['ORDINARIO', 'EXTRAORDINARIO', 'OTROS'].map((t) => `<label class="check"><input type="radio" name="oc-pres" value="${t}" ${d.presupuesto_tipo === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div>
                <div class="tabla-env"><table class="tabla"><thead><tr><th>Programa</th><th></th><th>Sub-prog.</th><th>Proyecto</th><th>Obra/A.C.</th><th>Partida</th><th>Genérica</th><th>Específica</th><th>Monto</th></tr></thead><tbody>
                  ${imp.map((l, i) => `<tr>${['programa', 'programa2', 'subprograma', 'proyecto', 'obra', 'partida', 'generica', 'especifica', 'monto'].map((k) => `<td><input class="campo" data-imp="${i}" data-k="${k}" value="${esc(k === 'monto' && l[k] ? fmt.num(l[k]) : (l[k] || ''))}" aria-label="${k} línea ${i + 1}" style="min-width:${k === 'monto' ? 100 : 56}px"></td>`).join('')}</tr>`).join('')}
                </tbody></table></div>
              </details>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div><label class="etiqueta" for="oc-lugar">Lugar de compra</label><input id="oc-lugar" class="campo" value="${esc(d.lugar_compra || '')}"></div>
                <div><label class="etiqueta" for="oc-moneda">Tipo de moneda</label><input id="oc-moneda" class="campo" value="${esc(d.moneda || '')}"></div>
              </div>
            </div>
            <aside class="tarjeta p-4 h-fit" aria-live="polite">
              <div class="mb-2"><label class="etiqueta" for="oc-desc">Descuento (%)</label><input id="oc-desc" class="campo num" inputmode="decimal" value="${esc(d.descuento_pct || 0)}"></div>
              <div id="oc-totales"></div>
            </aside>
          </div>
        </form>`,
      pie: `<button class="btn" data-cerrar>Cerrar</button><button class="btn" id="oc-prev">${ico('eye')} Vista previa</button>
        <button class="btn" id="oc-guardar">${ico('save')} Guardar</button><button class="btn btn-prim" id="oc-pdf">${ico('file-check')} Guardar y generar PDF</button>`
    });
    const el = m.el;
    const items = (d.items && d.items.length ? d.items : [{}]).map((x) => Object.assign({}, x));

    function pintarItems() {
      $('#items', el).innerHTML = items.map((it, i) => `<tr>
        <td><input class="campo" data-it="${i}" data-k="descripcion" value="${esc(it.descripcion || '')}" maxlength="300" aria-label="Descripción ítem ${i + 1}"></td>
        <td><input class="campo num" data-it="${i}" data-k="cantidad" value="${esc(it.cantidad !== undefined ? fmt.num(it.cantidad, Number(it.cantidad) % 1 ? 2 : 0) : '1')}" inputmode="decimal" aria-label="Cantidad ítem ${i + 1}"></td>
        <td><input class="campo num" data-it="${i}" data-k="precio_unitario" value="${esc(it.precio_unitario !== undefined && it.precio_unitario !== '' ? fmt.num(fmt.aNumero(it.precio_unitario)) : '')}" inputmode="decimal" aria-label="Precio ítem ${i + 1}"></td>
        <td class="text-center"><input type="checkbox" data-it="${i}" data-k="exento" ${it.exento ? 'checked' : ''} aria-label="Exento de IVA ítem ${i + 1}"></td>
        <td class="num" data-sub="${i}"></td><td class="num" data-iva="${i}"></td><td class="num" data-tot="${i}"></td>
        <td><button type="button" class="btn btn-ico" data-quitar="${i}" aria-label="Quitar ítem ${i + 1}" ${items.length === 1 ? 'disabled' : ''}>${ico('trash-2')}</button></td></tr>`).join('');
      $$('[data-quitar]', el).forEach((b) => b.addEventListener('click', () => { leerItems(); items.splice(Number(b.dataset.quitar), 1); pintarItems(); totales(); }));
      ui.iconos();
    }
    function leerItems() {
      $$('[data-it]', el).forEach((c) => {
        const it = items[Number(c.dataset.it)];
        it[c.dataset.k] = c.type === 'checkbox' ? c.checked : (c.dataset.k === 'descripcion' ? c.value : fmt.aNumero(c.value));
      });
    }
    function leer() {
      leerItems();
      return {
        id: orden.id, tipo: ($('input[name=oc-tipo]:checked', el) || {}).value || d.tipo, pago_id: d.pago_id, pago_numero: d.pago_numero,
        numero: $('#oc-num', el).value.replace(/\D/g, ''),
        fecha: $('#oc-fecha', el).value, requisicion: $('#oc-req', el).value, numero_proceso: $('#oc-proc', el).value,
        beneficiario: $('#oc-ben', el).value, tipo_doc: $('#oc-tipodoc', el).value, documento: $('#oc-doc', el).value,
        unidad_solicitante: $('#oc-unidad', el).value, tipo_pago: $('#oc-tpago', el).value, condicion: $('#oc-cond', el).value,
        fecha_emision: $('#oc-femi', el).value, concepto: $('#oc-conc', el).value, items: items.filter((it) => String(it.descripcion || '').trim() || it.precio_unitario),
        descuento_pct: fmt.aNumero($('#oc-desc', el).value) || 0, observaciones: $('#oc-obs', el).value,
        presupuesto_tipo: ($('input[name=oc-pres]:checked', el) || {}).value || '',
        imputacion: [0, 1, 2].map((i) => {
          const l = {};
          $$(`[data-imp="${i}"]`, el).forEach((c) => { l[c.dataset.k] = c.dataset.k === 'monto' ? fmt.aNumero(c.value) : c.value.trim(); });
          return l;
        }).filter((l) => Object.values(l).some((v) => v)),
        lugar_compra: $('#oc-lugar', el).value, moneda: $('#oc-moneda', el).value
      };
    }
    function totales() {
      const datos = leer();
      const k = calcular(items, cat.iva_pct, datos.descuento_pct);
      items.forEach((_, i) => {
        const f = k.filas[i];
        const set = (a, v) => { const c = $(`[data-${a}="${i}"]`, el); if (c) c.textContent = fmt.num(v); };
        set('sub', f.sub); set('iva', f.iva); set('tot', f.total);
      });
      const fila = (t, v, f) => `<div class="flex justify-between py-1 ${f ? 'font-semibold text-base' : ''}"><span>${t}</span><span class="num">${v}</span></div>`;
      $('#oc-totales', el).innerHTML = fila('Sub-total', fmt.bs(k.subtotal)) + fila(`IVA ${fmt.num(cat.iva_pct, 0)}%`, fmt.bs(k.iva)) + fila('Total exento', fmt.bs(k.exento)) +
        fila('Total general', fmt.bs(k.general)) + fila('Total final', fmt.bs(k.final), true);
      $('#add-item', el).disabled = items.length >= MAX_ITEMS;
      borrador.guardar(clave, datos);
    }
    pintarItems();
    totales();
    $('#form-oc', el).addEventListener('input', demorar(totales, 200));
    $('#form-oc', el).addEventListener('change', totales);
    $('#add-item', el).addEventListener('click', () => { leerItems(); if (items.length < MAX_ITEMS) items.push({ cantidad: 1 }); pintarItems(); totales(); });
    const revisarDoc = ui.validarDocumento($('#oc-tipodoc', el), $('#oc-doc', el), $('#oc-doc-ayuda', el));
    ui.autocompletarBeneficiario($('#oc-ben', el), (b) => {
      $('#oc-ben', el).value = b.nombre; $('#oc-tipodoc', el).value = b.tipo_doc; $('#oc-doc', el).value = b.documento; revisarDoc(); totales();
      if (b.problemas && b.problemas.length) ui.toast(`Revise los datos de ${b.nombre}: ${b.problemas.join(' · ')}`, 'aviso', 8000);
    });
    // También se busca escribiendo la cédula/RIF: si hay un solo registrado con ese número, se completa el nombre.
    $('#oc-doc', el).addEventListener('blur', async () => {
      const doc = $('#oc-doc', el).value.replace(/\D/g, '');
      if (doc.length < 5) return;
      try {
        const r = await api('beneficiarios.buscar', { texto: doc }, { silencioso: true });
        const t = $('#oc-tipodoc', el).value;
        const c = r.filter((b) => !t || b.tipo_doc === t);

        }
      } catch (e) { /* la búsqueda es solo una ayuda */ }
    });
    $$('input[name=oc-tipo]', el).forEach((r) => r.addEventListener('change', () => {
      $('h2', m.el).textContent = `Nueva ${nombreTipo(r.value).toLowerCase()} (registro manual)`;
    }));
    $('#oc-prev', el).addEventListener('click', async (ev) => {

      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
    const guardar = async (ev, generar) => {
      const btn = ev.currentTarget;
      ui.ocupado(btn, true);
      try {
        const r = await api('oc.guardar', Object.assign(leer(), { generar_pdf: generar }), { escritura: true });
        borrador.borrar(clave);
        m.cerrar();
        ui.toast(`${conNumero(r.orden)} registrada${generar ? ' y PDF generado en Drive' : ''}.`, 'exito');
        if (recargar) recargar();
        ui.documento({
          titulo: conNumero(r.orden), html: r.html, pdfUrl: r.pdf_url || r.orden.pdf_url,
          generarPdf: () => api('oc.pdf', { id: r.orden.id }, { escritura: true })
        });
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    };
    $('#oc-guardar', el).addEventListener('click', (ev) => guardar(ev, false));
    $('#oc-pdf', el).addEventListener('click', (ev) => guardar(ev, true));
  }

  return { render };
})();

  function importarListado(recargar) {

          ${App.enPruebas() ? '<br><span class="pill pill-aviso mt-1">Está en el entorno de pruebas: se importará solo aquí.</span>' : ''}</p>
        <label class="etiqueta" for="imp-archivo">Archivo (.xlsx, .xls, .ods o .csv)</label>

        <label class="etiqueta" for="imp-texto">…o pegue las filas copiadas de Excel (con la fila de títulos)</label>
        <textarea id="imp-texto" class="campo" rows="5" placeholder="Nº Documento	Tipo	Nombre o Razón Social	Número de cuenta"></textarea>
        <div id="imp-res" class="mt-3" aria-live="polite"></div>`,
      pie: '<button class="btn" data-cerrar>Cerrar</button><button class="btn" id="imp-sim">Revisar</button><button class="btn btn-prim" id="imp-ok" disabled>Importar</button>'
    });
    const el = m.el;
    const leerEntrada = async () => {
      const archivo = $('#imp-archivo', el).files[0];
      if (archivo) {
        if (archivo.size > 8 * 1024 * 1024) throw new Error('El archivo supera 8 MB.');
        const base64 = await new Promise((ok, falla) => { const l = new FileReader(); l.onload = () => ok(String(l.result).split(',')[1]); l.onerror = () => falla(new Error('No se pudo leer el archivo.')); l.readAsDataURL(archivo); });
        return { archivo: { nombre: archivo.name, base64 } };
      }
      const texto = $('#imp-texto', el).value.trim();
      if (!texto) throw new Error('Elija un archivo o pegue las filas del listado.');
      return { texto };
    };
    const mostrar = (r) => {
      $('#imp-res', el).innerHTML = `<div class="alerta ${r.simulacion ? 'alerta-info' : 'alerta-ok'}"><strong>${r.simulacion ? 'Revisión (todavía no se guardó nada)' : 'Importación completada'}</strong>

        </ul></div>`;
    };
    $('#imp-sim', el).addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      ui.ocupado(btn, true);
      try {
        entrada = await leerEntrada();
        const r = await api('beneficiarios.importar', Object.assign({ simular: true }, entrada), { escritura: true });

        $('#imp-ok', el).disabled = !(r.nuevos || r.actualizados);
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }

    $('#imp-ok', el).addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      if (!entrada) return;
      ui.ocupado(btn, true);
      try {
        const r = await api('beneficiarios.importar', entrada, { escritura: true });
        mostrar(r);
        btn.disabled = true;
        ui.toast(`${r.nuevos} beneficiario(s) nuevos y ${r.actualizados} completados.`, 'exito');
        recargar();
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
  }

        <div class="sm:col-span-4"><label class="etiqueta" for="b-cta">Cuenta bancaria</label><input id="b-cta" class="campo" inputmode="numeric" value="${esc(b.cuenta || '')}"><p class="ayuda" id="b-cta-ayuda"></p></div>
        <div class="sm:col-span-2"><label class="etiqueta" for="b-tel">Teléfono</label><input id="b-tel" class="campo" type="tel" value="${esc(b.telefono || '')}"></div>
        <div class="sm:col-span-2"><label class="etiqueta" for="b-mail">Correo</label><input id="b-mail" class="campo" type="email" value="${esc(b.correo || '')}"></div>
        <div class="sm:col-span-4"><label class="etiqueta" for="b-notas">Notas</label><textarea id="b-notas" class="campo" maxlength="500">${esc(b.notas || '')}</textarea></div>
        ${b.id ? `<label class="check sm:col-span-4"><input type="checkbox" id="b-activo" ${b.activo !== false ? 'checked' : ''}><span>Activo (desmarque para ocultarlo de las búsquedas; no se borra)</span></label>` : ''}
      </form>`,
      pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-prim" id="b-guardar">Guardar</button>'
    });
    const el = m.el;
    const cuentaOk = ui.validarCuenta($('#b-cta', el), $('#b-cta-ayuda', el));
    const docOk = ui.validarDocumento($('#b-tipo', el), $('#b-doc', el), $('#b-doc-ayuda', el));
    $('#b-guardar', el).addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;

        if (!seguir) return;
      }
      ui.ocupado(btn, true);
      try {
        const r = await api('beneficiarios.guardar', {
          id: b.id, tipo_doc: $('#b-tipo', el).value, documento: $('#b-doc', el).value, nombre: $('#b-nom', el).value,
          cuenta: $('#b-cta', el).value, telefono: $('#b-tel', el).value, correo: $('#b-mail', el).value, notas: $('#b-notas', el).value,
          activo: $('#b-activo', el) ? $('#b-activo', el).checked : true
        }, { escritura: true });
        m.cerrar();
        ui.toast(r.avisos && r.avisos.length ? `Guardado con errores: ${r.avisos.join(' · ')}` : 'Beneficiario guardado.', r.avisos && r.avisos.length ? 'aviso' : 'exito', 7000);
        recargar();
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
  }

  return { render, ficha };
})();

'use strict';

const Tasas = (() => {
  const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const diaSemana = (iso) => { const [a, m, d] = iso.split('-').map(Number); return DIAS[new Date(a, m - 1, d).getDay()]; };
  const FUENTES = { RELLENO: 'Fin de semana / feriado', MANUAL: 'Carga manual', IMPORTACION: 'Histórico', MIGRACION: 'Sistema anterior', BCV_TODAY: 'API bcv.today', BCV_TODAY_CDN: 'bcv.today (espejo)', HISTORICO_API: 'Histórico bcv.today', DOLARAPI: 'API dolarapi', BCV_WEB: 'Web del BCV' };

  async function render(cont) {
    const r = await api('tasas.listar', { dias: 120 });
    const editar = App.puede('tasas.editar');
    const s = r.ultima_sincronizacion;
    cont.innerHTML = `
      <div class="flex flex-wrap items-center gap-2 mb-3"><h1 class="titulo-pagina mr-auto">Tasa oficial BCV</h1>
        ${editar ? `<button class="btn" id="btn-hist-api">${ico('cloud-download')} Descargar histórico BCV</button><button class="btn" id="btn-hist">${ico('history')} Importar archivo</button><button class="btn" id="btn-manual">${ico('pencil')} Cargar tasa</button>
        <button class="btn btn-prim" id="btn-sync">${ico('refresh-cw')} Sincronizar ahora</button>` : ''}</div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
        <div class="tarjeta p-4"><div class="kpi-etiqueta">Tasa aplicable hoy</div><div class="kpi-valor">${r.hoy ? fmt.num(r.hoy.tasa, 2) + ' Bs.' : '—'}</div>
          <div class="suave text-xs">${r.hoy ? (r.hoy.exacta ? 'Registrada para hoy' : `Última disponible: ${fmt.fecha(r.hoy.fecha)}`) : 'No hay tasas registradas'}</div></div>
        <div class="tarjeta p-4"><div class="kpi-etiqueta">Última sincronización automática</div>
          <div class="font-semibold mt-1">${s ? fmt.fechaHora(s.cuando) : 'Nunca'}</div>
          <div class="text-xs ${s && !s.ok ? '' : 'suave'}" style="${s && !s.ok ? 'color:var(--peligro)' : ''}">${s ? (s.ok ? `${esc(FUENTES[s.fuente] || s.fuente)} · fecha valor ${fmt.fecha(s.fecha)}` : esc(s.error)) : 'Se ejecuta a las 6:00 y 17:00'}</div></div>
        <div class="tarjeta p-4"><div class="kpi-etiqueta">Consultar una fecha</div>
          <div class="flex gap-2 mt-1"><input type="date" id="c-fecha" class="campo" aria-label="Fecha a consultar"><button class="btn" id="btn-consultar">Ver</button></div>
          <div id="c-res" class="text-sm mt-1"></div></div>
      </div>
      <p class="suave text-sm mb-3">Histórico: ${r.total} días (${fmt.fecha(r.desde)} – ${fmt.fecha(r.hasta)}). Los fines de semana y feriados toman la última tasa publicada, porque también hay pagos esos días.</p>
      <div class="tarjeta p-4 mb-3"><div style="height:240px"><canvas id="g-tasas" aria-label="Gráfico de la tasa BCV"></canvas></div></div>
      <div class="tarjeta tabla-env"><table class="tabla"><thead><tr><th>Fecha</th><th>Día</th><th class="num">Bs. por US$</th><th>Origen</th></tr></thead><tbody>
        ${r.tasas.map((t) => `<tr><td>${fmt.fecha(t.fecha)}</td><td>${diaSemana(t.fecha)}</td><td class="num font-medium">${fmt.num(t.tasa, 4)}</td>
          <td><span class="pill ${t.fuente === 'RELLENO' ? 'pill-neutro' : t.fuente === 'MANUAL' ? 'pill-aviso' : 'pill-info'}">${esc(FUENTES[t.fuente] || t.fuente)}</span></td></tr>`).join('')}
      </tbody></table></div>`;
    const orden = r.tasas.slice().reverse();
    App.grafico($('#g-tasas'), {
      type: 'line',
      data: { labels: orden.map((t) => fmt.fecha(t.fecha).slice(0, 5)), datasets: [{ label: 'Bs. por US$', data: orden.map((t) => t.tasa), borderColor: '#1f5f4a', backgroundColor: 'rgba(31,95,74,.12)', fill: true, tension: .2, pointRadius: 0 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: (v) => fmt.num(v, 0) } } } }
    });
    $('#btn-consultar').addEventListener('click', async () => {
      const f = $('#c-fecha').value;
      if (!f) return;
      try {
        const t = await api('tasas.consultar', { fecha: f });
        $('#c-res').innerHTML = t ? `<strong>${fmt.num(t.tasa, 4)} Bs.</strong> ${t.exacta ? '' : `<span class="suave">(de ${fmt.fecha(t.fecha)})</span>`}` : '<span class="suave">Sin tasa para esa fecha.</span>';
      } catch (e) { ui.error(e); }
    });
    if (!editar) return;
    $('#btn-sync').addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      ui.ocupado(btn, true);
      try {
        const x = await api('tasas.sincronizar', {}, { escritura: true });
        ui.toast(`Tasa ${fmt.num(x.tasa, 4)} Bs. (fecha valor ${fmt.fecha(x.fecha)}) desde ${FUENTES[x.fuente] || x.fuente}. ${x.relleno.creadas} día(s) rellenados${x.recuperacion && x.recuperacion.recuperadas ? `, ${x.recuperacion.recuperadas} día(s) hábiles recuperados` : ''}, ${x.pagos_actualizados} registro(s) actualizados.`, 'exito', 8000);
        App.navegar();
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
    $('#btn-hist-api').addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      const ok = await ui.confirmar({ titulo: 'Descargar histórico de bcv.today', mensaje: 'Se agregan las fechas que falten (hasta 5 años) y se reemplazan los días rellenados. Las tasas cargadas a mano o importadas no se modifican.', textoBoton: 'Descargar' });
      if (!ok) return;
      ui.ocupado(btn, true);
      try {
        const x = await api('tasas.importarHistoricoApi', {}, { escritura: true });
        ui.toast(`Histórico ${fmt.fecha(x.desde)} – ${fmt.fecha(x.hasta)}: ${x.creadas} días nuevos, ${x.reemplazadas} reemplazados, ${x.relleno.creadas} rellenados.`, 'exito', 9000);
        App.navegar();
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
    $('#btn-manual').addEventListener('click', () => {
      const m = ui.modal({
        titulo: 'Cargar tasa manualmente',
        cuerpo: `<p class="suave text-sm mb-3">Use esta opción si la sincronización falla. Reemplaza el valor de esa fecha y los días siguientes sin tasa propia.</p>
          <div class="grid grid-cols-2 gap-3"><div><label class="etiqueta" for="m-fecha">Fecha valor</label><input type="date" id="m-fecha" class="campo" value="${fmt.hoy()}"></div>
          <div><label class="etiqueta" for="m-tasa">Bs. por US$</label><input id="m-tasa" class="campo num" inputmode="decimal" placeholder="0,0000"></div></div>`,
        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-prim" id="m-ok">Guardar</button>'
      });
      $('#m-ok', m.el).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        ui.ocupado(btn, true);
        try {
          await api('tasas.guardarManual', { fecha: $('#m-fecha', m.el).value, tasa: $('#m-tasa', m.el).value }, { escritura: true });
          m.cerrar(); ui.toast('Tasa guardada.', 'exito'); App.navegar();
        } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
      });
    });
    $('#btn-hist').addEventListener('click', () => {
      const m = ui.modal({
        titulo: 'Importar histórico de tasas', tamano: 'mediano',
        cuerpo: `<p class="suave text-sm mb-2">Pegue líneas con fecha y monto (por ejemplo <code>9/11/2026 Bs897,54</code> o <code>09/11/2026;897,54</code>) o elija un archivo .csv/.txt. Las fechas que ya existen no se modifican salvo que marque la casilla.</p>
          <input type="file" id="h-archivo" accept=".csv,.txt" class="mb-2" aria-label="Archivo de tasas">
          <textarea id="h-texto" class="campo" style="min-height:220px;font-family:ui-monospace,monospace" aria-label="Tasas a importar"></textarea>
          <label class="check mt-2"><input type="checkbox" id="h-sobre"><span>Sobrescribir tasas existentes con estos valores</span></label>`,
        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-prim" id="h-ok">Importar</button>'
      });
      $('#h-archivo', m.el).addEventListener('change', (e) => { const f = e.target.files[0]; if (f) f.text().then((t) => { $('#h-texto', m.el).value = t; }); });
      $('#h-ok', m.el).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        ui.ocupado(btn, true);
        try {
          const x = await api('tasas.importarTexto', { texto: $('#h-texto', m.el).value, sobrescribir: $('#h-sobre', m.el).checked }, { escritura: true });
          m.cerrar();
          ui.toast(`Leídas ${x.leidas}: ${x.creadas} nuevas, ${x.actualizadas} actualizadas, ${x.relleno.creadas} días rellenados.${x.errores.length ? `\n${x.errores.length} línea(s) no se pudieron leer.` : ''}`, x.errores.length ? 'aviso' : 'exito', 9000);
          App.navegar();
        } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
      });
    });
  }
  return { render };
})();

App.registrar({ id: 'tasas', titulo: 'Tasa BCV', icono: 'trending-up', permiso: 'ver', render: Tasas.render });

;

'use strict';

const Admin = (() => {
  const ROLES = { ADMIN: 'Administrador', TESORERIA: 'Tesorería', COMPRAS: 'Compras', CONSULTA: 'Consulta' };
  const PESTANAS = [['sistema', 'Sistema'], ['entorno', 'Entorno de pruebas'], ['config', 'Configuración'], ['usuarios', 'Usuarios'], ['auditoria', 'Auditoría'], ['migracion', 'Migración']];

  async function render(cont, p) {
    const actual = PESTANAS.some(([k]) => k === p.tab) ? p.tab : 'sistema';
    cont.innerHTML = `<h1 class="titulo-pagina mb-3">Administración</h1>
      <div class="pestanas mb-4" role="tablist">${PESTANAS.map(([k, t]) => `<a class="pestana" role="tab" aria-selected="${k === actual}" href="#/admin?tab=${k}" style="text-decoration:none">${t}</a>`).join('')}</div>
      <div id="panel-admin"></div>`;
    const panel = $('#panel-admin', cont);
    await ({ sistema, entorno, config: configuracion, usuarios, auditoria, migracion })[actual](panel);
    ui.iconos();
  }

  async function sistema(panel) {
    const e = await api('admin.estado');
    const sync = e.ultima_sincronizacion_tasa;
    panel.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="tarjeta p-4 space-y-2">
          <h2 class="font-semibold">Recursos</h2>
          <p><a href="${esc(e.base_datos_url)}" target="_blank" rel="noopener">${ico('sheet', 'inline w-4 h-4')} Base de datos (Google Sheets)</a></p>
          <p><a href="${esc(e.carpeta_url)}" target="_blank" rel="noopener">${ico('folder', 'inline w-4 h-4')} Carpeta de documentos (Drive)</a></p>
          <p class="text-sm">Entorno: ${e.entorno === 'PRUEBAS' ? '<span class="pill pill-aviso">PRUEBAS (datos ficticios)</span>' : '<span class="pill pill-ok">Producción</span>'}</p>
          <p class="text-sm">Versión <strong>${esc(e.version)}</strong> · ID de cliente Google: ${e.client_id_configurado ? '<span class="pill pill-ok">configurado</span>' : '<span class="pill pill-peligro">falta</span>'}</p>
          <p class="text-sm">Disparadores: ${e.disparadores.length ? e.disparadores.map((d) => `<span class="pill pill-neutro">${esc(d)}</span>`).join(' ') : '<span class="pill pill-peligro">ninguno</span>'}</p>
        </div>
        <div class="tarjeta p-4 space-y-2">
          <h2 class="font-semibold">Mantenimiento</h2>
          <p class="text-sm">Última tasa BCV: ${sync ? `${fmt.fechaHora(sync.cuando)} · ${sync.ok ? '<span class="pill pill-ok">correcta</span>' : `<span class="pill pill-peligro">error</span> ${esc(sync.error)}`}` : 'sin registro'}</p>
          <p class="text-sm">Último respaldo: ${e.ultimo_respaldo ? `<a href="${esc(e.ultimo_respaldo.url)}" target="_blank" rel="noopener">${fmt.fechaHora(e.ultimo_respaldo.cuando)}</a>` : 'ninguno'}</p>
          <button class="btn" id="btn-respaldo">${ico('database-backup')} Respaldar ahora</button>
          <p class="suave text-xs">El respaldo diario se crea a las 23:00 en la carpeta "Respaldos". Guarde periódicamente una copia fuera de esta cuenta.</p>
        </div>
        <div class="tarjeta p-4 md:col-span-2"><h2 class="font-semibold mb-2">Registros por tabla</h2>
          <div class="flex flex-wrap gap-2">${Object.keys(e.conteos).map((k) => `<span class="pill pill-info">${esc(k)}: ${fmt.num(e.conteos[k], 0)}</span>`).join('')}</div>
          <p class="text-sm mt-3">Próximos números: OP <strong>${e.correlativos.op}</strong> · OC <strong>${e.correlativos.oc}</strong> · OS <strong>${e.correlativos.os}</strong></p></div>
      </div>`;
    $('#btn-respaldo').addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      ui.ocupado(btn, true);
      try { await api('admin.respaldar', {}, { escritura: true }); ui.toast('Respaldo creado en Drive.', 'exito'); App.navegar(); } catch (x) { ui.error(x); } finally { ui.ocupado(btn, false); }
    });
  }

  /* ---------- Entorno de pruebas ---------- */
  async function entorno(panel) {
    const e = await api('entorno.estado');
    const enPruebas = e.activo === 'PRUEBAS';
    const conteos = (c) => `<div class="flex flex-wrap gap-2 text-sm"><span class="pill pill-info">Pagos: ${fmt.num(c.pagos, 0)}</span><span class="pill pill-info">Beneficiarios: ${fmt.num(c.beneficiarios, 0)}</span>
      <span class="pill pill-info">OP generadas: ${fmt.num(c.ordenes_pago, 0)}</span><span class="pill pill-info">OC/OS: ${fmt.num(c.ordenes_compra_servicio, 0)}</span></div>`;
    panel.innerHTML = `
      <div class="alerta ${enPruebas ? 'alerta-aviso' : 'alerta-ok'} mb-3">Ahora mismo el sistema trabaja con <strong>${enPruebas ? 'el ENTORNO DE PRUEBAS (datos ficticios)' : 'los DATOS REALES (producción)'}</strong>.
        El cambio aplica a todos los usuarios. Usuarios y tasas BCV son los mismos en ambos entornos.</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="tarjeta p-4 space-y-3">
          <div class="flex items-center gap-2"><h2 class="font-semibold mr-auto">${ico('flask-conical', 'inline w-4 h-4')} Entorno de pruebas</h2>${enPruebas ? '<span class="pill pill-aviso">Activo</span>' : ''}</div>
          ${e.existe_pruebas ? `${conteos(e.pruebas.conteos)}
            <p class="text-sm">Creado el ${fmt.fechaHora(e.pruebas.creado_en)} por ${esc(e.pruebas.creado_por || '')} · <a href="${esc(e.pruebas.url)}" target="_blank" rel="noopener">abrir su hoja</a></p>`
            : '<p class="text-sm">Crea una base aparte con 12 beneficiarios ficticios (6 con errores de tipeo en cédula/RIF o cuenta), y si quiere, una copia de los beneficiarios reales, y 10 pagos de los dos meses anteriores, de categorías distintas y sin órdenes generadas. Los PDF van a una carpeta "ENTORNO DE PRUEBAS" en Drive.</p>'}
          <label class="check text-sm"><input type="checkbox" id="ent-copiar" ${e.produccion.conteos.beneficiarios ? 'checked' : 'disabled'}>
            <span>Incluir una copia de los ${fmt.num(e.produccion.conteos.beneficiarios, 0)} beneficiarios reales (para practicar con conciliaciones reales)</span></label>
          <div class="flex flex-wrap gap-2">
            ${!e.existe_pruebas ? `<button class="btn btn-prim" id="ent-crear">${ico('flask-conical')} Crear entorno de pruebas</button>` : ''}
            ${e.existe_pruebas && !enPruebas ? `<button class="btn btn-prim" id="ent-ir">Usar el entorno de pruebas</button>` : ''}
            ${e.existe_pruebas ? `<button class="btn" id="ent-reiniciar">${ico('rotate-ccw')} Reiniciar datos de prueba</button>` : ''}
          </div>
        </div>
        <div class="tarjeta p-4 space-y-3">
          <div class="flex items-center gap-2"><h2 class="font-semibold mr-auto">Datos reales (producción)</h2>${!enPruebas ? '<span class="pill pill-ok">Activo</span>' : ''}</div>
          ${conteos(e.produccion.conteos)}
          <p class="suave text-sm">Las pruebas nunca escriben aquí.</p>
          <div class="flex flex-wrap gap-2">
            ${enPruebas ? '<button class="btn" id="ent-prod">Ver datos reales (sin borrar las pruebas)</button>' : ''}
            ${e.existe_pruebas ? `<button class="btn btn-peligro" id="ent-terminar">${ico('check')} Terminar pruebas y empezar con datos reales</button>` : ''}
          </div>
          ${e.produccion.conteos.pagos || e.produccion.conteos.beneficiarios ? `<p class="text-xs suave">Producción ya tiene registros. Si alguno fue de práctica, anúlelo (no se borra nada real).</p>` : ''}
        </div>
      </div>`;
    const accion = async (btn, nombre, datos, mensaje, ruta) => {
      ui.ocupado(btn, true);
      try {
        await api(nombre, datos, { escritura: true });
        ui.toast(mensaje, 'exito');
        setTimeout(() => App.recargarTodo(ruta), 600);
      } catch (x) { ui.error(x); ui.ocupado(btn, false); }
    };
    const enlazar = (id, fn) => { const b = $(id, panel); if (b) b.addEventListener('click', (ev) => fn(ev.currentTarget)); };
    const crear = async (btn, reinicio) => {
      const ok = await ui.confirmarEscribiendo({
        titulo: reinicio ? 'Reiniciar el entorno de pruebas' : 'Crear el entorno de pruebas',
        mensaje: `<p>${reinicio ? 'Todo lo que hizo en pruebas (pagos, órdenes, PDF de prueba) se reemplaza por los datos ficticios iniciales. La hoja anterior de pruebas va a la papelera de Drive.' : 'Se creará una base de datos de práctica con datos ficticios.'}</p>
          <p class="mt-2">El sistema quedará en <strong>modo pruebas para todos los usuarios</strong> hasta que vuelva a producción. Los datos reales no se tocan.</p>`,
        palabra: 'PRUEBAS', textoBoton: reinicio ? 'Reiniciar' : 'Crear'

      if (ok) accion(btn, 'entorno.crear', { confirmacion: 'PRUEBAS', copiar_beneficiarios: $('#ent-copiar', panel) ? $('#ent-copiar', panel).checked : true }, 'Entorno de pruebas listo.', '#/pagos?anio=&mes=');

    enlazar('#ent-prod', (btn) => accion(btn, 'entorno.cambiar', { destino: 'PRODUCCION' }, 'Ahora trabaja con los datos reales.', '#/panel'));
    enlazar('#ent-terminar', async (btn) => {
      const ok = await ui.confirmarEscribiendo({
        titulo: 'Terminar pruebas y empezar con datos reales',
        mensaje: `<p>Se elimina el entorno de pruebas: su hoja va a la papelera de Drive (recuperable durante 30 días) y el sistema queda trabajando con los datos reales.</p>
          <p class="mt-2">Producción tiene hoy ${fmt.num(e.produccion.conteos.pagos, 0)} pago(s) y ${fmt.num(e.produccion.conteos.beneficiarios, 0)} beneficiario(s); no se modifican.</p>`,
        palabra: 'REALES', textoBoton: 'Terminar pruebas', peligro: true
      });
      if (ok) accion(btn, 'entorno.eliminar', { confirmacion: 'REALES' }, 'Listo: ya puede cargar datos reales.', '#/panel');

  /* ---------- Configuración ---------- */
  async function configuracion(panel) {
    const lista = await api('admin.config');
    const valor = (k) => (lista.find((c) => c.clave === k) || {}).valor;
    const seccion = (clave, titulo, cuerpo, ayuda) => `<form class="tarjeta p-4" data-clave="${clave}" novalidate>
      <h2 class="font-semibold mb-1">${titulo}</h2>${ayuda ? `<p class="suave text-sm mb-3">${ayuda}</p>` : '<div class="mb-2"></div>'}${cuerpo}
      <div class="mt-3 text-right"><button class="btn btn-prim btn-chico" type="submit">Guardar</button></div></form>`;
    const inst = valor('institucion');
    const deb = valor('cuenta_debito');
    const cor = valor('correlativos');
    const campo = (id, et, v, extra = '') => `<div><label class="etiqueta" for="${id}">${et}</label><input id="${id}" class="campo" value="${esc(v === null || v === undefined ? '' : v)}" ${extra}></div>`;
    panel.innerHTML = `<div class="alerta alerta-info mb-3">Los porcentajes de retención, la alícuota de IVA y los firmantes dependen de normas y decisiones de Administración, Hacienda y Despacho: valide cada cambio con el área responsable.</div>
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-3">
      ${seccion('correlativos', 'Próximos números', `<div class="grid grid-cols-3 gap-3">${campo('cor-op', 'Orden de pago', cor.op, 'inputmode="numeric"')}${campo('cor-oc', 'Orden de compra', cor.oc, 'inputmode="numeric"')}${campo('cor-os', 'Orden de servicio', cor.os, 'inputmode="numeric"')}</div>`, 'No pueden ser menores o iguales al último número ya usado.')}
      ${seccion('cuenta_debito', 'Cuenta de débito de la Alcaldía', `<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">${campo('deb-tipo', 'Tipo de pago', deb.tipo_pago)}${campo('deb-banco', 'Banco', deb.banco)}${campo('deb-num', 'Número de cuenta', deb.numero, 'inputmode="numeric"')}</div>`)}
      ${seccion('firmas_op', 'Firmantes de la Orden de Pago', valor('firmas_op').map((f, i) => `<div class="grid grid-cols-2 gap-2 mb-2">${campo(`fop-c${i}`, `Cargo ${i + 1}`, f.cargo)}${campo(`fop-n${i}`, 'Nombre', f.nombre)}</div>`).join(''))}
      ${seccion('firmas_oc', 'Casillas de firma de Orden de Compra/Servicio', `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${valor('firmas_oc').map((f, i) => campo(`foc-${i}`, `Casilla ${i + 1}`, f)).join('')}</div>`)}
      ${seccion('retenciones', 'Retenciones fiscales', `<div class="tabla-env"><table class="tabla"><thead><tr><th>Nombre en la orden</th><th>%</th><th>Se calcula sobre</th></tr></thead><tbody>
        ${valor('retenciones').map((r, i) => `<tr><td><input class="campo" id="ret-n${i}" value="${esc(r.nombre)}" aria-label="Nombre retención ${i + 1}"></td>
          <td>${r.fila_titulo ? '—' : `<input class="campo num" id="ret-p${i}" value="${esc(fmt.num(r.porcentaje, r.porcentaje % 1 ? 2 : 0))}" style="width:80px" aria-label="Porcentaje ${esc(r.nombre)}">`}</td>
          <td>${r.fila_titulo ? '—' : `<select class="campo" id="ret-b${i}" aria-label="Base ${esc(r.nombre)}">${ui.opciones([{ valor: 'BASE', texto: 'Base imponible' }, { valor: 'IVA', texto: 'IVA' }, { valor: 'TOTAL', texto: 'Total con IVA' }], r.base)}</select>`}</td></tr>`).join('')}
        </tbody></table></div>`, 'El orden de las filas es el de la plantilla impresa.')}
      ${seccion('iva_pct', 'IVA', `<div class="w-40">${campo('iva', 'Alícuota (%)', valor('iva_pct'), 'inputmode="decimal"')}</div>`)}
      ${seccion('categorias', 'Categorías de pago', `<div id="cats" class="space-y-2">${valor('categorias').map((c, i) => `<div class="flex gap-2"><input type="color" id="cat-c${i}" value="${esc(c.color)}" aria-label="Color" style="width:44px;height:36px"><input class="campo" id="cat-n${i}" value="${esc(c.nombre)}" aria-label="Categoría ${i + 1}"></div>`).join('')}</div>
        <button type="button" class="btn btn-chico mt-2" id="cat-mas">${ico('plus')} Agregar</button>`, 'No se pueden eliminar categorías que ya tienen pagos.')}
      ${seccion('unidades', 'Unidades solicitantes', `<textarea id="unidades" class="campo" style="min-height:160px" aria-label="Unidades, una por línea">${esc(valor('unidades').join('\n'))}</textarea>`, 'Una por línea.')}
      ${seccion('institucion', 'Datos del membrete', `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${['pais', 'estado', 'nombre', 'rif', 'ciudad', 'lugar_compra', 'pie', 'telefono'].map((k) => campo(`inst-${k}`, k.replace('_', ' '), inst[k])).join('')}</div>`)}
      ${seccion('beneficiario_nomina', 'Nombre para movimientos de nómina', campo('nomina', 'Beneficiario', valor('beneficiario_nomina')))}
      ${seccion('tolerancia_diferencia', 'Tolerancia de diferencia en la OP', `<div class="w-40">${campo('tol', 'Bs.', valor('tolerancia_diferencia'), 'inputmode="decimal"')}</div>`, 'Diferencia máxima entre lo pagado y el neto calculado. Si la supera, la orden solo puede guardarse como borrador.')}
      ${seccion('correo_solicitudes', 'Correo para solicitudes de acceso', `<div class="max-w-sm">${campo('correo-sol', 'Correo', valor('correo_solicitudes') || '', 'type="email" placeholder="Vacío: la cuenta dueña del sistema"')}</div>`, 'Recibe un aviso cuando alguien sin acceso intenta entrar (máximo uno por persona cada 24 horas).')}
      ${seccion('umbral_fondo_negro', 'Fondo Negro Primero', `<div class="w-48">${campo('umbral-fn', 'Total de factura mayor a (Bs.)', valor('umbral_fondo_negro') || 100000, 'inputmode="decimal"')}</div>`, 'Se aplica automáticamente (3% del total) cuando el total de la factura supera este monto.')}
      </div>`;
    let nCats = valor('categorias').length;
    $('#cat-mas').addEventListener('click', () => {
      $('#cats').insertAdjacentHTML('beforeend', `<div class="flex gap-2"><input type="color" id="cat-c${nCats}" value="#e2e8f0" aria-label="Color" style="width:44px;height:36px"><input class="campo" id="cat-n${nCats}" aria-label="Categoría nueva"></div>`);
      nCats++;
    });
    const lectores = {
      correlativos: () => ({ op: Number($('#cor-op').value), oc: Number($('#cor-oc').value), os: Number($('#cor-os').value) }),
      cuenta_debito: () => ({ tipo_pago: $('#deb-tipo').value, banco: $('#deb-banco').value, numero: $('#deb-num').value }),
      firmas_op: () => [0, 1, 2, 3].map((i) => ({ cargo: $(`#fop-c${i}`).value, nombre: $(`#fop-n${i}`).value })),
      firmas_oc: () => [0, 1, 2, 3, 4, 5].map((i) => $(`#foc-${i}`).value),
      retenciones: () => valor('retenciones').map((r, i) => Object.assign({}, r, { nombre: $(`#ret-n${i}`).value, porcentaje: r.fila_titulo ? null : fmt.aNumero($(`#ret-p${i}`).value), base: r.fila_titulo ? r.base : $(`#ret-b${i}`).value })),
      iva_pct: () => fmt.aNumero($('#iva').value),
      categorias: () => Array.from({ length: nCats }, (_, i) => ({ nombre: ($(`#cat-n${i}`) || {}).value || '', color: ($(`#cat-c${i}`) || {}).value })).filter((c) => c.nombre.trim()),
      unidades: () => $('#unidades').value.split('\n').map((x) => x.trim()).filter(Boolean),
      institucion: () => { const o = {}; ['pais', 'estado', 'nombre', 'rif', 'ciudad', 'lugar_compra', 'pie', 'telefono'].forEach((k) => { o[k] = $(`#inst-${k}`).value; }); return o; },
      beneficiario_nomina: () => $('#nomina').value,
      tolerancia_diferencia: () => fmt.aNumero($('#tol').value),
      correo_solicitudes: () => $('#correo-sol').value.trim(),
      umbral_fondo_negro: () => fmt.aNumero($('#umbral-fn').value)
    };
    $$('form[data-clave]', panel).forEach((f) => f.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = $('button[type=submit]', f);
      ui.ocupado(btn, true);
      try {
        await api('admin.guardarConfig', { clave: f.dataset.clave, valor: lectores[f.dataset.clave]() }, { escritura: true });
        ui.toast('Configuración guardada. Los usuarios la verán al recargar.', 'exito');
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    }));
  }

  /* ---------- Usuarios ---------- */
  async function usuarios(panel) {
    const [lista, solicitudes] = await Promise.all([api('admin.usuarios'), api('admin.solicitudes')]);
    const pendientes = solicitudes.filter((x) => x.estado === 'PENDIENTE');
    const resueltas = solicitudes.filter((x) => x.estado !== 'PENDIENTE').slice(0, 10);
    panel.innerHTML = `
      <div class="tarjeta p-4 mb-3">
        <h2 class="font-semibold mb-1">Solicitudes de acceso ${pendientes.length ? `<span class="pill pill-aviso">${pendientes.length} pendiente(s)</span>` : ''}</h2>
        <p class="suave text-xs mb-3">Quien entra por primera vez queda aquí y se avisa por correo (a la cuenta indicada en Configuración; por defecto, la dueña del sistema). Recuerde: cuentas institucionales por dirección.</p>
        ${pendientes.length ? `<div class="space-y-3">${pendientes.map((x) => `<div class="sugerencia-op" data-sol="${x.id}">
            <div class="flex flex-wrap items-center gap-2 mb-2"><strong class="mr-auto">${esc(x.nombre || x.email)}</strong><span class="suave text-xs">${esc(x.email)} · ${fmt.fechaHora(x.solicitado_en)} · ${x.intentos} intento(s)</span></div>
            ${x.error_notificacion ? `<p class="text-xs mb-2" style="color:var(--aviso)">El correo de aviso no se pudo enviar: ${esc(x.error_notificacion)}</p>` : ''}
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 items-end">
              <div><label class="etiqueta" for="s-nom-${x.id}">Nombre</label><input id="s-nom-${x.id}" class="campo" value="${esc(x.nombre || '')}"></div>
              <div><label class="etiqueta" for="s-rol-${x.id}">Rol</label><select id="s-rol-${x.id}" class="campo">${ui.opciones(Object.keys(ROLES).map((k) => ({ valor: k, texto: ROLES[k] })), 'CONSULTA')}</select></div>
              <div><label class="etiqueta" for="s-dir-${x.id}">Dirección</label><input id="s-dir-${x.id}" class="campo" list="dirs-sol"></div>
            </div>
            <div class="flex flex-wrap gap-2 mt-2"><button class="btn btn-prim btn-chico" data-aprobar="${x.id}">${ico('user-check')} Aprobar</button>
              <button class="btn btn-chico" data-rechazar="${x.id}">${ico('user-x')} Rechazar</button></div></div>`).join('')}
            <datalist id="dirs-sol">${App.estado.catalogos.unidades.map((u) => `<option value="${esc(u)}">`).join('')}</datalist></div>`
          : '<p class="suave text-sm">No hay solicitudes pendientes.</p>'}
        ${resueltas.length ? `<details class="mt-3"><summary class="text-sm cursor-pointer">Últimas resueltas</summary><ul class="text-xs mt-2 space-y-1">${resueltas.map((x) => `<li>${esc(x.email)} · ${x.estado === 'APROBADA' ? `aprobada (${esc(ROLES[x.rol_asignado] || x.rol_asignado)})` : `rechazada: ${esc(x.motivo)}`} · ${fmt.fechaHora(x.resuelto_en)}</li>`).join('')}</ul></details>` : ''}
      </div>
      <div class="flex mb-3"><p class="suave text-sm mr-auto">Solo las cuentas registradas aquí pueden entrar. Los usuarios no se borran: se desactivan.</p>
      <button class="btn btn-prim" id="u-nuevo">${ico('user-plus')} Nuevo usuario</button></div>
      <div class="tarjeta tabla-env"><table class="tabla"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Dirección</th><th>Último acceso</th><th>Estado</th><th></th></tr></thead><tbody>
      ${lista.map((u) => `<tr><td class="font-medium">${esc(u.nombre)}</td><td>${esc(u.email)}</td><td>${esc(u.rol_nombre)}</td><td class="text-xs">${esc(u.direccion)}</td>
        <td class="text-xs">${fmt.fechaHora(u.ultimo_acceso) || '—'}</td><td>${u.activo ? '<span class="pill pill-ok">Activo</span>' : '<span class="pill pill-neutro">Inactivo</span>'}</td>
        <td><button class="btn btn-ico" data-id="${u.id}" aria-label="Editar ${esc(u.nombre)}">${ico('pencil')}</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="tarjeta p-4 mt-3 text-sm"><h2 class="font-semibold mb-1">Qué puede hacer cada rol</h2><ul class="list-disc pl-5 space-y-1">
        <li><strong>Administrador:</strong> todo, incluida configuración, usuarios, reactivar órdenes y corregir fecha/monto de pagos.</li>
        <li><strong>Tesorería:</strong> importar conciliaciones, completar pagos, generar y anular órdenes de pago, beneficiarios y tasas.</li>
        <li><strong>Compras:</strong> crear, editar y anular órdenes de compra y servicio; beneficiarios.</li>
        <li><strong>Consulta:</strong> ver e imprimir.</li></ul></div>`;
    const abrir = (u) => {
      const m = ui.modal({
        titulo: u.id ? 'Editar usuario' : 'Nuevo usuario',
        cuerpo: `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="sm:col-span-2"><label class="etiqueta" for="u-email">Correo de Google</label><input id="u-email" type="email" class="campo" value="${esc(u.email || '')}"></div>
          <div><label class="etiqueta" for="u-nombre">Nombre</label><input id="u-nombre" class="campo" value="${esc(u.nombre || '')}"></div>
          <div><label class="etiqueta" for="u-rol">Rol</label><select id="u-rol" class="campo">${ui.opciones(Object.keys(ROLES).map((k) => ({ valor: k, texto: ROLES[k] })), u.rol || 'CONSULTA')}</select></div>
          <div class="sm:col-span-2"><label class="etiqueta" for="u-dir">Dirección</label><input id="u-dir" class="campo" list="dirs" value="${esc(u.direccion || '')}"><datalist id="dirs">${App.estado.catalogos.unidades.map((x) => `<option value="${esc(x)}">`).join('')}</datalist></div>
          <label class="check sm:col-span-2"><input type="checkbox" id="u-activo" ${u.activo !== false ? 'checked' : ''}><span>Activo</span></label></div>`,
        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-prim" id="u-ok">Guardar</button>'
      });
      $('#u-ok', m.el).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        ui.ocupado(btn, true);
        try {
          await api('admin.guardarUsuario', { id: u.id, email: $('#u-email', m.el).value, nombre: $('#u-nombre', m.el).value, rol: $('#u-rol', m.el).value, direccion: $('#u-dir', m.el).value, activo: $('#u-activo', m.el).checked }, { escritura: true });
          m.cerrar(); ui.toast('Usuario guardado.', 'exito'); App.navegar();
        } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
      });
    };
    $('#u-nuevo').addEventListener('click', () => abrir({}));
    $$('[data-aprobar]', panel).forEach((b) => b.addEventListener('click', async () => {
      const id = b.dataset.aprobar;
      const sol = pendientes.find((x) => x.id === id);
      const rol = $(`#s-rol-${id}`, panel).value;
      const ok = await ui.confirmar({ titulo: 'Aprobar acceso', mensaje: `${esc(sol.email)} podrá entrar con el rol <strong>${esc(ROLES[rol])}</strong>.`, textoBoton: 'Aprobar' });
      if (!ok) return;
      try {
        await api('admin.resolverSolicitud', { id, aprobar: true, rol, nombre: $(`#s-nom-${id}`, panel).value, direccion: $(`#s-dir-${id}`, panel).value }, { escritura: true });
        ui.toast(`Acceso aprobado para ${sol.email}. Ya puede entrar.`, 'exito');
        App.navegar();
      } catch (e) { ui.error(e); }
    }));
    $$('[data-rechazar]', panel).forEach((b) => b.addEventListener('click', async () => {
      const id = b.dataset.rechazar;
      const sol = pendientes.find((x) => x.id === id);
      const motivo = await ui.confirmar({ titulo: 'Rechazar acceso', mensaje: `${esc(sol.email)} no podrá entrar. La persona verá el motivo.`, textoBoton: 'Rechazar', peligro: true, pedirMotivo: true });
      if (!motivo) return;
      try {
        await api('admin.resolverSolicitud', { id, aprobar: false, motivo }, { escritura: true });
        ui.toast('Solicitud rechazada.', 'exito');
        App.navegar();
      } catch (e) { ui.error(e); }
    }));
    $$('[data-id]', panel).forEach((b) => b.addEventListener('click', () => abrir(lista.find((u) => u.id === b.dataset.id))));
  }

  /* ---------- Auditoría ---------- */
  async function auditoria(panel) {
    const f = { texto: '', modulo: '', pagina: 1 };
    panel.innerHTML = `<div class="tarjeta p-3 mb-3 flex flex-wrap gap-2">
        <select id="a-mod" class="campo" style="width:auto" aria-label="Módulo">${ui.opciones(['PAGOS', 'ORDEN_PAGO', 'ORDEN_COMPRA', 'CONCILIACION', 'BENEFICIARIOS', 'TASAS', 'ADMIN', 'SISTEMA', 'ENTORNO'], '', 'Todos los módulos')}</select>
        <input id="a-txt" class="campo flex-1 min-w-[200px]" placeholder="Buscar usuario, acción, número…" aria-label="Buscar en auditoría"></div>
      <div class="tarjeta"><div id="a-tabla" class="tabla-env"></div><div id="a-pag"></div></div>`;
    const cargar = async () => {
      const r = await api('admin.auditoria', f);
      $('#a-tabla').innerHTML = `<table class="tabla"><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
        ${r.registros.map((a) => `<tr><td class="whitespace-nowrap">${fmt.fechaHora(a.fecha_hora)}</td><td class="text-xs">${esc(a.usuario)}</td><td>${esc(a.modulo)}</td><td>${esc(a.accion)}</td>
          <td><details><summary class="cursor-pointer text-xs suave">ver</summary><pre class="text-xs whitespace-pre-wrap" style="max-width:520px">${esc(JSON.stringify(a.detalle, null, 1))}</pre></details></td></tr>`).join('') || '<tr><td colspan="5" class="suave">Sin registros.</td></tr>'}</tbody></table>`;
      $('#a-pag').replaceChildren(ui.paginacion(r.total, r.pagina, r.por_pagina, (n) => { f.pagina = n; cargar().catch(ui.error); }));
      ui.iconos();
    };
    $('#a-mod').addEventListener('change', () => { f.modulo = $('#a-mod').value; f.pagina = 1; cargar().catch(ui.error); });
    $('#a-txt').addEventListener('input', demorar(() => { f.texto = $('#a-txt').value; f.pagina = 1; cargar().catch(ui.error); }, 400));
    await cargar();
  }

  /* ---------- Migración ---------- */
  function migracion(panel) {
    panel.innerHTML = `<div class="tarjeta p-5 max-w-3xl">
      <h2 class="font-semibold mb-1">Traer datos de la hoja de cálculo anterior</h2>
      <p class="suave text-sm mb-3">Lee las pestañas <code>Pagos_*</code>, la de beneficiarios (encabezado "Nombre o Razón Social") y <code>Tasa_BCV</code>. La hoja anterior no se modifica.
        Puede ejecutarse varias veces: solo agrega lo que falta (por número de orden, documento o fecha). Primero use "Simular".</p>
      <label class="etiqueta" for="m-id">Enlace o ID de la hoja anterior</label>
      <input id="m-id" class="campo mb-3" placeholder="https://docs.google.com/spreadsheets/d/…/edit">
      <div class="flex gap-2"><button class="btn" id="m-sim">${ico('flask-conical')} Simular</button><button class="btn btn-prim" id="m-run" disabled>${ico('import')} Migrar</button></div>
      <div id="m-res" class="mt-4"></div></div>`;
    const mostrar = (r) => {
      $('#m-res').innerHTML = `<div class="alerta ${r.simulacion ? 'alerta-info' : 'alerta-ok'}"><strong>${r.simulacion ? 'Simulación' : 'Migración completada'}</strong>
        <ul class="list-disc pl-5 mt-1"><li>Pestañas leídas: ${esc(r.hojas_leidas.join(', ') || 'ninguna')}</li>
        <li>Pagos encontrados: ${r.pagos_encontrados} · nuevos: <strong>${r.pagos_nuevos}</strong></li>
        <li>Beneficiarios nuevos: <strong>${r.beneficiarios_nuevos}</strong></li>
        <li>Tasas encontradas: ${r.tasas_encontradas} · nuevas: <strong>${r.tasas_nuevas}</strong></li>
        ${r.proximo_numero_op ? `<li>Próximo número de OP: <strong>${r.proximo_numero_op}</strong></li>` : ''}</ul></div>`;
    };
    $('#m-sim').addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      ui.ocupado(btn, true);
      try { const r = await api('admin.migrar', { spreadsheet_id: $('#m-id').value, simular: true }); mostrar(r); $('#m-run').disabled = false; } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
    $('#m-run').addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      const ok = await ui.confirmar({ titulo: 'Confirmar migración', mensaje: 'Se agregarán al sistema los registros indicados en la simulación.', textoBoton: 'Migrar' });
      if (!ok) return;
      ui.ocupado(btn, true);
      try { mostrar(await api('admin.migrar', { spreadsheet_id: $('#m-id').value }, { escritura: true })); } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
  }

  return { render };
})();

App.registrar({ id: 'admin', titulo: 'Administración', icono: 'settings', permiso: 'admin', render: Admin.render });

</script>
  <script>document.addEventListener('DOMContentLoaded', function () { App.iniciar(); });</script>
</body>
</html>
