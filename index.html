/*
 * Estilos de componentes (independientes de Tailwind para que funcionen igual con o sin CDN).
 * Sistema: ERP Alcaldía de Guanipa · Módulo de Órdenes · v1.0.0-beta
 * © 2026 Soluciones AFFINITY.
 */
:root {
  --primario: #1f5f4a; --primario-hover: #174a3a; --primario-suave: #e3f1ec;
  --fondo: #f3f5f7; --superficie: #ffffff; --superficie-2: #f8fafb; --borde: #d5dde3; --borde-fuerte: #b7c3cc;
  --texto: #18232d; --suave: #566676; --peligro: #b42318; --peligro-suave: #fdecea; --aviso: #9a4b06; --aviso-suave: #fff4e5;
  --exito: #067647; --exito-suave: #e6f6ee; --info: #175cd3; --info-suave: #eaf2ff; --foco: #2e90fa;
  --sombra: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  color-scheme: light;
}
.dark {
  --primario: #3aa37f; --primario-hover: #4bb991; --primario-suave: #163a2f;
  --fondo: #0d141a; --superficie: #141f27; --superficie-2: #1a2731; --borde: #283946; --borde-fuerte: #3a4f5f;
  --texto: #e5edf3; --suave: #9db0c0; --peligro: #f97066; --peligro-suave: #3b1715; --aviso: #fdb022; --aviso-suave: #3a2a0c;
  --exito: #47cd89; --exito-suave: #0f3324; --info: #84adff; --info-suave: #14254a; --foco: #84caff;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
html, body { background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
body { font-size: 14px; line-height: 1.45; }
a { color: var(--info); }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.saltar { position: absolute; left: -999px; top: 0; background: var(--superficie); padding: 8px 12px; z-index: 100; }
.saltar:focus { left: 8px; top: 8px; }

/* Estructura */
.lateral { background: var(--superficie); border-right: 1px solid var(--borde); }
.lateral a.nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--texto); text-decoration: none; font-weight: 500; }
.lateral a.nav:hover { background: var(--superficie-2); }
.lateral a.nav.activo { background: var(--primario-suave); color: var(--primario); }
.lateral a.nav svg, .lateral a.nav i { width: 18px; height: 18px; flex: none; }
.barra { background: var(--superficie); border-bottom: 1px solid var(--borde); }
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; box-shadow: var(--sombra); }
.suave { color: var(--suave); }
.titulo-pagina { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.separador { border-top: 1px solid var(--borde); }

/* Respaldo de iconos cuando el CDN no responde */
i[data-lucide]:empty::before { content: attr(data-alt); font-style: normal; font-weight: 700; font-size: 15px; line-height: 1; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 8px;
  font-weight: 600; font-size: 13.5px; border: 1px solid var(--borde-fuerte); background: var(--superficie); color: var(--texto); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--superficie-2); }

  /** Muestra un documento imprimible (HTML del servidor) con acciones. */
  documento({ titulo, html, pdfUrl, generarPdf, aviso }) {
    const m = ui.modal({
      titulo: esc(titulo), tamano: 'grande',
      cuerpo: `${aviso ? `<div class="alerta alerta-aviso mb-3">${aviso}</div>` : ''}<iframe class="visor" title="${esc(titulo)}"></iframe>`,
      pie: `<span class="suave mr-auto text-xs">Tamaño carta. En la ventana de impresión elija márgenes "Predeterminados" y active "Gráficos de fondo".</span>
        ${pdfUrl ? `<a class="btn" href="${esc(pdfUrl)}" target="_blank" rel="noopener" id="lnk-pdf">${ico('file-text')} Abrir PDF en Drive</a>` : ''}
        ${generarPdf ? `<button class="btn" id="btn-gen-pdf">${ico('cloud-upload')} ${pdfUrl ? 'Regenerar' : 'Generar'} PDF en Drive</button>` : ''}
        <button class="btn btn-prim" id="btn-imprimir">${ico('printer')} Imprimir</button>`
    });
    const marco = $('iframe', m.el);
    marco.srcdoc = html;
    $('#btn-imprimir', m.el).addEventListener('click', () => { marco.contentWindow.focus(); marco.contentWindow.print(); });
    const btnPdf = $('#btn-gen-pdf', m.el);
    if (btnPdf) {
      btnPdf.addEventListener('click', async () => {
        ui.ocupado(btnPdf, true);
        try {
          const r = await generarPdf();
          ui.toast('PDF guardado en Google Drive.', 'exito');
          window.open(r.pdf_url, '_blank', 'noopener');
          m.cerrar();
        } catch (e) { ui.error(e); } finally { ui.ocupado(btnPdf, false); }
      });
    }
    return m;
  },

  ocupado(boton, si) { if (!boton) return; boton.disabled = si; boton.classList.toggle('cargando', si); },
  error(e) { console.error(e); ui.toast(e && e.message ? e.message : String(e), 'error'); },

  paginacion(total, pagina, porPagina, alCambiar) {
    const paginas = Math.max(1, Math.ceil(total / porPagina));
    const cont = document.createElement('div');
    cont.className = 'flex items-center justify-between gap-2 px-3 py-2 text-sm';
    cont.innerHTML = `<span class="suave">${fmt.num(total, 0)} registro(s) · página ${pagina} de ${paginas}</span>
      <div class="flex gap-1"><button class="btn btn-chico" data-p="${pagina - 1}" ${pagina <= 1 ? 'disabled' : ''} aria-label="Página anterior">${ico('chevron-left')}</button>
      <button class="btn btn-chico" data-p="${pagina + 1}" ${pagina >= paginas ? 'disabled' : ''} aria-label="Página siguiente">${ico('chevron-right')}</button></div>`;
    $$('[data-p]', cont).forEach((b) => b.addEventListener('click', () => alCambiar(Number(b.dataset.p))));
    return cont;
  },

  opciones(lista, seleccion, vacio) {
    return (vacio !== undefined ? `<option value="">${esc(vacio)}</option>` : '') +
      lista.map((o) => {
        const v = typeof o === 'object' ? o.valor : o;
        const t = typeof o === 'object' ? o.texto : o;
        return `<option value="${esc(v)}" ${String(v) === String(seleccion) ? 'selected' : ''}>${esc(t)}</option>`;
      }).join('');
  },

  pillCategoria(nombre) {
    if (!nombre) return '<span class="pill pill-neutro">Sin categoría</span>';
    const cat = (App.estado.catalogos.categorias || []).find((c) => c.nombre === nombre);
    return `<span class="pill pill-cat" style="background:${esc(cat ? cat.color : '#e2e8f0')}">${esc(nombre)}</span>`;
  },

  selectorPeriodo(anio, mes, conTodos = true) {
    const actual = new Date().getFullYear();
    const anios = [];
    for (let a = actual + 1; a >= 2024; a--) anios.push(a);
    return `<label class="sr-only" for="f-anio">Año</label><select id="f-anio" class="campo" style="width:auto">${ui.opciones(anios, anio, conTodos ? 'Todos los años' : undefined)}</select>
      <label class="sr-only" for="f-mes">Mes</label><select id="f-mes" class="campo" style="width:auto">${ui.opciones(MESES.map((m, i) => ({ valor: i + 1, texto: m })), mes, conTodos ? 'Todos los meses' : undefined)}</select>`;
  },

  /** Campo de beneficiario con búsqueda en el registro. alElegir recibe el beneficiario. */
  autocompletarBeneficiario(input, alElegir) {
    const cont = input.parentElement;
    cont.style.position = 'relative';
    let lista = null;
    const cerrar = () => { if (lista) { lista.remove(); lista = null; } };
    let consulta = 0;
    const buscar = demorar(async () => {
      const texto = input.value.trim();
      if (texto.length === 1) { cerrar(); return; }
      const n = ++consulta;
      try {
        const r = await api('beneficiarios.buscar', { texto }, { silencioso: true });
        if (n !== consulta || document.activeElement !== input && !(lista && lista.contains(document.activeElement))) return;
        cerrar();
        lista = document.createElement('div');
        lista.className = 'autocompletar';
        lista.setAttribute('role', 'listbox');
        lista.innerHTML = (texto ? '' : '<div class="suave text-xs px-3 py-1">Beneficiarios más frecuentes · escriba para buscar</div>') +
          (r.length ? r.map((b, i) => `<button type="button" role="option" data-i="${i}"><strong>${esc(b.nombre)}</strong>${b.problemas && b.problemas.length ? ' <span class="pill pill-aviso">revisar datos</span>' : ''}
          <span class="suave text-xs block">${esc(fmt.doc(b.tipo_doc, b.documento))} · ${esc(b.cuenta || 'sin cuenta')}${b.banco ? ' · ' + esc(b.banco) : ''}</span></button>`).join('')
            : '<div class="suave text-sm px-3 py-2">No está registrado. Complete los datos y se registrará al guardar.</div>');
        cont.appendChild(lista);
        $$('button', lista).forEach((b) => b.addEventListener('click', () => { alElegir(r[Number(b.dataset.i)]); cerrar(); }));
      } catch (e) { cerrar(); }
    }, 300);
    input.setAttribute('autocomplete', 'off');
    input.addEventListener('input', buscar);
    input.addEventListener('focus', () => { if (!lista) buscar(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' && lista) { e.preventDefault(); const b = $('button', lista); if (b) b.focus(); }
      if (e.key === 'Escape') cerrar();
    });
    document.addEventListener('click', (e) => { if (!cont.contains(e.target)) cerrar(); });
  },

  /** Marca el campo de cuenta en vivo. Devuelve una función que dice si se puede guardar (vacía o válida). */
  validarCuenta(input, ayuda) {
    const revisar = () => {
      const r = reglas.cuenta(input.value);
      ayuda.textContent = r.texto;
      ayuda.classList.toggle('error', !r.ok);
      input.classList.toggle('error', !r.ok);
      input.setAttribute('aria-invalid', String(!r.ok));
      return r.ok;
    };
    input.addEventListener('input', revisar);
    input.addEventListener('blur', () => { const d = input.value.replace(/\D/g, ''); if (d.length === 20) input.value = fmt.cuenta(d); });
    revisar();
    return revisar;
  },

  /** Igual para cédula/RIF. Los errores avisan pero no bloquean (el servidor guarda la marca). */
  validarDocumento(selectTipo, input, ayuda) {
    const revisar = () => {
      const r = reglas.documento(selectTipo.value, input.value);
      ayuda.textContent = r.texto;
      if (r.sugerido) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'enlace ml-1';
        b.textContent = 'Usar ese';
        b.addEventListener('click', () => { input.value = r.sugerido; revisar(); input.dispatchEvent(new Event('change', { bubbles: true })); });
        ayuda.append(' ', b);
      }
      const error = !r.ok && !r.vacio;
      ayuda.classList.toggle('error', error);
      input.classList.toggle('error', error);
      input.setAttribute('aria-invalid', String(error));
      return r.ok;
    };
    input.addEventListener('input', revisar);
    selectTipo.addEventListener('change', revisar);
    revisar();
    return revisar;
  },

  /** Confirmación para acciones grandes: hay que escribir una palabra. */
  confirmarEscribiendo({ titulo, mensaje, palabra, textoBoton, peligro = false }) {
    return new Promise((resolver) => {
      let respondido = false;
      const m = ui.modal({
        titulo: esc(titulo),
        cuerpo: `<div>${mensaje}</div><div class="mt-3"><label class="etiqueta" for="conf-palabra">Para confirmar escriba <strong>${esc(palabra)}</strong></label>
          <input id="conf-palabra" class="campo" autocomplete="off" spellcheck="false"></div>`,
        pie: `<button class="btn" data-cerrar>Cancelar</button><button class="btn ${peligro ? 'btn-peligro' : 'btn-prim'}" id="btn-conf" disabled>${esc(textoBoton)}</button>`,
        alCerrar: () => { if (!respondido) resolver(false); }
      });
      const campo = $('#conf-palabra', m.el);
      const boton = $('#btn-conf', m.el);
      campo.addEventListener('input', () => { boton.disabled = campo.value.trim().toUpperCase() !== palabra; });
      campo.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !boton.disabled) boton.click(); });
      boton.addEventListener('click', () => { respondido = true; m.cerrar(); resolver(true); });
    });
  }
};

/* ---------- Borradores locales (por si se va la luz o el internet) ---------- */
const borrador = {
  guardar(clave, datos) { try { localStorage.setItem('borrador:' + clave, JSON.stringify({ cuando: Date.now(), datos })); } catch (e) { /* almacenamiento lleno o bloqueado */ } },
  leer(clave) { try { const v = JSON.parse(localStorage.getItem('borrador:' + clave)); return v && Date.now() - v.cuando < 7 * 864e5 ? v.datos : null; } catch (e) { return null; } },
  borrar(clave) { try { localStorage.removeItem('borrador:' + clave); } catch (e) { /* sin acceso */ } }
};

/* ---------- Cliente de la API ---------- */
class ErrorApi extends Error {
  constructor(mensaje, codigo, detalle) { super(mensaje); this.codigo = codigo; this.detalle = detalle; }
}

/* ---------- Ventana "Cargando": bloquea la pantalla mientras el servidor trabaja ---------- */
const Cargando = (() => {
  let pendientes = 0;
  let temporizador = null;
  let el = null;
  let previo = null;
  const bloquearTeclas = (e) => { if (el && !el.hidden && e.key !== 'Tab') { e.preventDefault(); e.stopPropagation(); } };
  function crear() {
    el = document.createElement('div');
    el.className = 'ventana-cargando';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-live', 'assertive');
    el.tabIndex = -1;
    el.innerHTML = '<div class="cargando-caja"><span class="girador" aria-hidden="true"></span><span class="cargando-texto"></span></div>';
    el.hidden = true;
    document.body.appendChild(el);
    document.addEventListener('keydown', bloquearTeclas, true);
  }
  function mostrar(texto) {
    if (!el) crear();
    el.querySelector('.cargando-texto').textContent = texto;
    el.hidden = false;
    document.body.setAttribute('aria-busy', 'true');
    previo = document.activeElement;
    el.focus();
  }
  return {
    iniciar(texto) {
      pendientes++;
      if (el && !el.hidden) { el.querySelector('.cargando-texto').textContent = texto; return; }
      clearTimeout(temporizador);
      // Solo aparece si tarda: las respuestas que salen de la caché no parpadean.
      temporizador = setTimeout(() => mostrar(texto), 250);
    },
    texto(t) { if (el && !el.hidden) el.querySelector('.cargando-texto').textContent = t; },
    terminar() {
      pendientes = Math.max(0, pendientes - 1);
      if (pendientes) return;
      clearTimeout(temporizador);
      if (el && !el.hidden) {
        el.hidden = true;
        if (previo && previo.isConnected && previo.focus) previo.focus();
      }
      document.body.removeAttribute('aria-busy');
    }
  };
})();

/* ---------- Caché de consultas: se reutiliza mientras los datos del servidor no cambien ---------- */
const CacheApi = (() => {
  const RUTAS = ['panel.resumen', 'pagos.listar', 'pagos.obtener', 'conciliacion.historial', 'oc.listar', 'oc.obtener',
    'beneficiarios.listar', 'beneficiarios.detalle', 'tasas.listar', 'op.vista', 'oc.vista'];
  const FRESCO_MS = 30000;
  const MAXIMO = 80;
  const datos = new Map();
  const copia = (v) => (v === undefined ? v : JSON.parse(JSON.stringify(v)));
  return {
    aplica: (accion) => RUTAS.includes(accion),
    clave: (accion, d) => accion + '|' + JSON.stringify(d || {}),
    leer: (clave) => datos.get(clave) || null,
    fresca: (e) => e && Date.now() - e.cuando < FRESCO_MS,
    copia,
    guardar(clave, v, valor) {
      datos.delete(clave);
      datos.set(clave, { v, valor: copia(valor), cuando: Date.now() });
      if (datos.size > MAXIMO) datos.delete(datos.keys().next().value);
    },
    tocar(e) { e.cuando = Date.now(); },
    vaciar: () => datos.clear()
  };
})();

/**
 * Llamada a la API. Opciones: escritura (reintentos idempotentes), silencioso (sin ventana "Cargando"),
 * mensaje (texto de la ventana) y sinCache.
 */
async function api(accion, datos = {}, opciones = {}) {
  const usarCache = !opciones.escritura && !opciones.sinCache && CacheApi.aplica(accion);
  const clave = usarCache ? CacheApi.clave(accion, datos) : '';
  const previa = usarCache ? CacheApi.leer(clave) : null;
  if (previa && CacheApi.fresca(previa)) return CacheApi.copia(previa.valor);
  const silencioso = opciones.silencioso === true;
  if (!silencioso) Cargando.iniciar(opciones.mensaje || (opciones.escritura ? 'Guardando…' : 'Cargando…'));
  try {
    const r = await llamarApi(accion, previa ? Object.assign({}, datos, { _version: previa.v }) : datos, opciones);
    if (opciones.escritura) CacheApi.vaciar();
    if (r.sin_cambios && previa) { CacheApi.tocar(previa); return CacheApi.copia(previa.valor); }
    if (usarCache && r.v) CacheApi.guardar(clave, r.v, r.datos);
    return r.datos;
  } finally {
    if (!silencioso) Cargando.terminar();
  }
}

async function llamarApi(accion, datos, opciones) {
  const idSolicitud = opciones.escritura ? idUnico() : undefined;
  const intentos = opciones.escritura ? 4 : 3;
  let ultimoError;
  for (let i = 0; i < intentos; i++) {
    if (!navigator.onLine) await esperarConexion();
    try {
      const r = await fetch(window.CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion, datos, token: Sesion.token(), id_solicitud: idSolicitud }),
        redirect: 'follow'
      });
      const texto = await r.text();
      let cuerpo;
      try { cuerpo = JSON.parse(texto); } catch (e) { throw new ErrorApi('El servidor respondió algo inesperado. Intente de nuevo.', 'RESPUESTA'); }
      avisoRed(false);
      if (cuerpo.ok) return cuerpo;
      if (['TOKEN_INVALIDO', 'SIN_SESION'].includes(cuerpo.codigo)) {
        await Sesion.renovar();
        continue;
      }
      const detalle = cuerpo.codigo === 'ERROR_INTERNO' && cuerpo.detalle ? `\nDetalle técnico: ${cuerpo.detalle}` : '';
      throw new ErrorApi(cuerpo.error + detalle, cuerpo.codigo, cuerpo.detalle);
    } catch (e) {
      if (e instanceof ErrorApi) throw e;
      ultimoError = e;
      avisoRed(true, 'Problema de conexión. Reintentando…');
      Cargando.texto('Problema de conexión. Reintentando…');
      await new Promise((ok) => setTimeout(ok, [1500, 3500, 7000, 12000][i]));
    }
  }
  avisoRed(true, 'Sin conexión con el servidor. Sus datos siguen en pantalla; intente de nuevo.');
  throw new ErrorApi('No se pudo conectar con el servidor. Revise el internet e intente de nuevo.', 'RED', ultimoError && ultimoError.message);
}

function avisoRed(mostrar, texto) {
  const a = $('#aviso-red');
  if (!a) return;
  a.hidden = !mostrar;
  if (texto) a.textContent = texto;
}
function esperarConexion() {
  avisoRed(true, 'Sin internet. Esperando conexión…');
  return new Promise((ok) => window.addEventListener('online', function f() { window.removeEventListener('online', f); avisoRed(false); ok(); }));
}
window.addEventListener('offline', () => avisoRed(true, 'Sin internet. Lo que esté escribiendo se conserva en este equipo.'));
window.addEventListener('online', () => avisoRed(false));

/* ---------- Sesión con Google Identity Services ---------- */
const Sesion = (() => {
  let credencial = null;
  let esperando = null;

  function vence(token) {
    try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; }
  }
  function token() {
    if (window.CONFIG.TOKEN_PRUEBA) return window.CONFIG.TOKEN_PRUEBA;
    return credencial;
  }
  function guardar(t) {
    credencial = t;
    try { sessionStorage.setItem('gtoken', t); } catch (e) { /* sin almacenamiento */ }
  }
  function cargarGuardado() {
    try {
      const t = sessionStorage.getItem('gtoken');
      if (t && vence(t) - Date.now() > 120000) { credencial = t; return true; }
    } catch (e) { /* sin almacenamiento */ }
    return false;
  }
  function esperarGis() {
    return new Promise((ok, falla) => {
      let n = 0;
      const t = setInterval(() => {
        if (window.google && google.accounts && google.accounts.id) { clearInterval(t); ok(); }
        if (++n > 100) { clearInterval(t); falla(new Error('No se pudo cargar el inicio de sesión de Google. Revise el internet.')); }
      }, 100);
    });
  }
  async function iniciarGis(alObtener) {
    await esperarGis();
    google.accounts.id.initialize({
      client_id: window.CONFIG.GOOGLE_CLIENT_ID,
      callback: (r) => { guardar(r.credential); alObtener(r.credential); },
      auto_select: true,
      cancel_on_tap_outside: false,
      use_fedcm_for_prompt: true
    });
  }
  /** Pide una credencial nueva cuando la actual vence (sin perder lo que hay en pantalla). */
  function renovar() {
    if (window.CONFIG.TOKEN_PRUEBA) return Promise.reject(new ErrorApi('Token de prueba inválido.', 'SIN_SESION'));
    if (esperando) return esperando;
    try { sessionStorage.removeItem('gtoken'); } catch (e) { /* sin almacenamiento */ }
    esperando = new Promise((ok) => {
      const m = ui.modal({
        titulo: 'Su sesión venció',
        cuerpo: '<p class="mb-3">Por seguridad, confirme su cuenta para continuar. No se pierde lo que estaba haciendo.</p><div id="gis-renovar" class="flex justify-center"></div>'
      });
      iniciarGis(() => { m.cerrar(); esperando = null; ok(); }).then(() => {
        google.accounts.id.renderButton($('#gis-renovar', m.el), { theme: 'outline', size: 'large', text: 'continue_with', locale: 'es' });
        // Tras un rechazo o una solicitud pendiente no se reintenta solo (evita un ciclo de entradas).
      if (!codigo) google.accounts.id.prompt();
      }).catch(ui.error);
    });
    return esperando;
  }
  function salir() {
    credencial = null;
    try { sessionStorage.removeItem('gtoken'); } catch (e) { /* sin almacenamiento */ }
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    location.hash = '';
    location.reload();
  }
  return { token, iniciarGis, cargarGuardado, renovar, salir };
})();

/* ---------- Aplicación ---------- */
const App = (() => {
  const estado = { usuario: null, catalogos: {}, sistema: {}, tasaHoy: null };
  const modulos = [];
  let graficos = [];
  let entrando = null;
  let escuchando = false;
  let vistaActual = 0;

  function registrar(modulo) { modulos.push(modulo); }
  function puede(permiso) {
    const p = (estado.usuario && estado.usuario.permisos) || [];
    return p.includes('*') || p.includes(permiso);
  }

  async function iniciar() {
    document.documentElement.classList.remove('dark');
    try { localStorage.removeItem('tema'); } catch (e) { /* sin almacenamiento */ }
    if (!window.CONFIG || !window.CONFIG.API_URL || window.CONFIG.API_URL.includes('REEMPLAZAR')) {
      $('#app').innerHTML = `<div class="max-w-lg mx-auto mt-20 tarjeta p-6"><h1 class="titulo-pagina mb-2">Falta configurar</h1>
        <p>Edite <code>config.js</code> con la URL de la API (Apps Script) y el ID de cliente de Google.</p></div>`;
      return;
    }
    if (window.CONFIG.TOKEN_PRUEBA || Sesion.cargarGuardado()) return entrar();
    pantallaLogin();
  }

  function pantallaLogin(mensaje, codigo) {
    const solicitud = codigo === 'SOLICITUD_ENVIADA';
    const mantenimiento = codigo === 'PERMISOS_SISTEMA';
    const tipo = solicitud ? 'alerta-info' : (mantenimiento ? 'alerta-aviso' : 'alerta-peligro');

  /** Google puede llamar al callback más de una vez (selección automática + botón): se entra una sola vez. */
  function entrar() {
    if (estado.usuario) return Promise.resolve();
    if (entrando) return entrando;
    entrando = entrarUnaVez().finally(() => { entrando = null; });
    return entrando;
  }

  async function entrarUnaVez() {
    $('#app').innerHTML = '<div class="flex items-center justify-center min-h-screen suave">Verificando acceso…</div>';
    try {
      const s = await api('sesion.iniciar');
      estado.usuario = s.usuario;
      estado.catalogos = s.catalogos;
      estado.sistema = s.sistema;
      estado.tasaHoy = s.tasa_hoy;
      estado.solicitudesPendientes = s.solicitudes_pendientes || 0;
      armarEstructura();
      if (!escuchando) { window.addEventListener('hashchange', navegar); escuchando = true; }
      navegar();
    } catch (e) {
      try { sessionStorage.removeItem('gtoken'); } catch (x) { /* sin almacenamiento */ }
      if (window.CONFIG.TOKEN_PRUEBA) { $('#app').innerHTML = `<p class="p-6">${esc(e.message)}</p>`; return; }
      pantallaLogin(e.message, e.codigo);
    }
  }

  function enPruebas() { return estado.sistema && estado.sistema.entorno === 'PRUEBAS'; }

  /** Tras cambiar de entorno se recarga todo para traer catálogos y correlativos del entorno nuevo. */
  function recargarTodo(ruta) {
    location.hash = ruta || '#/panel';
    location.reload();
  }

  function modulosVisibles() { return modulos.filter((m) => !m.permiso || puede(m.permiso)); }

  function parametros() {
    const [ruta, consulta] = location.hash.replace(/^#\/?/, '').split('?');
    const p = {};
    new URLSearchParams(consulta || '').forEach((v, k) => { p[k] = v; });
    return { ruta: ruta || '', p };
  }

  function navegar() {
    const { ruta, p } = parametros();
    const visibles = modulosVisibles();
    const modulo = visibles.find((m) => m.id === ruta) || visibles[0];
    if (!modulo) return;
    graficos.forEach((g) => g.destroy());
    graficos = [];
    $$('a.nav').forEach((a) => a.classList.toggle('activo', a.dataset.mod === modulo.id));
    $('#titulo-barra').textContent = modulo.titulo;
    document.title = `${modulo.titulo} · ERP Guanipa`;
    // Cada navegación dibuja en un contenedor nuevo: si una pantalla anterior termina de cargar tarde,
    // escribe en un contenedor ya retirado y su error no se muestra.
    // Al cambiar de pantalla se cierran las ventanas abiertas de la anterior.
    MODALES.slice().reverse().forEach((cerrar) => cerrar(true));
    const n = ++vistaActual;
    const vista = document.createElement('div');
    vista.innerHTML = '<div class="suave p-6">Cargando…</div>';
    $('#contenido').replaceChildren(vista);
    Promise.resolve().then(() => modulo.render(vista, p)).catch((e) => {
      if (n !== vistaActual) { console.warn('Pantalla anterior descartada:', e && e.message); return; }
      vista.innerHTML = `<div class="alerta alerta-peligro">${esc(e.message || e)}</div>`;
      console.error(e);
    }).finally(() => { if (n === vistaActual) ui.iconos(); });
  }

  function grafico(canvas, config) {
    if (!window.Chart) { canvas.replaceWith(Object.assign(document.createElement('p'), { className: 'suave text-sm', textContent: 'Gráfico no disponible sin conexión a internet.' })); return null; }
    const oscuro = document.documentElement.classList.contains('dark');

    Chart.defaults.font.family = 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
    const g = new Chart(canvas, config);
    graficos.push(g);
    return g;
  }

  return { estado, registrar, puede, iniciar, navegar, grafico, enPruebas, recargarTodo };

/**
 * Módulo: Pagos realizados y Órdenes de Pago.
 * Sistema: ERP Alcaldía de Guanipa · Módulo de Órdenes · v1.0.12-beta

 */
'use strict';

const Pagos = (() => {
  const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

  /** Mismo cálculo que el servidor (calcularOrdenPago) para mostrar el resultado al instante. */
  function calcularOP(entrada, retenciones, ivaPct, pagado, umbralFN) {
    const conFactura = entrada.con_factura !== false;
    const base = conFactura ? r2(fmt.aNumero(entrada.base_imponible) || 0) : 0;
    const iva = r2(base * Number(ivaPct) / 100);
    const total = r2(base + iva);
    const fondoNegro = total > (Number(umbralFN) || 100000);
    const elegidas = entrada.retenciones.filter((c) => c !== 'FONDO_NEGRO').concat(fondoNegro ? ['FONDO_NEGRO'] : []);
    const bases = { BASE: base, IVA: iva, TOTAL: total, NINGUNA: 0 };
    const filas = retenciones.map((r) => {
      const sel = base > 0 && elegidas.includes(r.codigo) && Number(r.porcentaje) > 0;
      return Object.assign({}, r, { seleccionada: sel, valor_procesar: sel ? bases[r.base] : null, valor_retencion: sel ? r2(bases[r.base] * r.porcentaje / 100) : null });
    });
    const totalRet = r2(filas.reduce((s, f) => s + (f.valor_retencion || 0), 0));
    const filaIva = filas.find((f) => f.codigo === 'IVA');
    const empresa = base > 0 ? r2(total - totalRet) : null;
    return {
      conFactura, base, iva, total, filas, totalRet, empresa, fondoNegro: base > 0 && fondoNegro,
      restanteIva: base > 0 ? (filaIva && filaIva.seleccionada ? r2(iva - filaIva.valor_retencion) : 0) : null,
      diferencia: base > 0 ? r2(pagado - empresa) : null
    };
  }

  function estadoPill(p) {
    if (p.estado === 'ANULADA') return '<span class="pill pill-peligro">Anulada</span>';
    if (p.estado_datos === 'POR_COMPLETAR') return `<span class="pill pill-aviso">Por completar</span>${p.op_borrador ? ' <span class="pill pill-info">Con borrador</span>' : ''}`;
    if (p.op_generada) return '<span class="pill pill-ok">OP generada</span>';
    if (p.op_borrador) {
      return p.op_descuadre
        ? `<span class="pill pill-peligro" title="Borrador guardado: el neto no cuadra con lo pagado (${esc(fmt.bs(p.op_descuadre))})">Borrador · no cuadra</span>`
        : '<span class="pill pill-info" title="Hay datos de la orden guardados; falta generarla">Borrador en curso</span>';
    }
    return '<span class="pill pill-neutro">OP pendiente</span>';
  }

  /* ---------- Lista ---------- */
  async function render(cont, p) {
    const hoy = new Date();
    const filtros = {
      anio: p.anio !== undefined ? p.anio : hoy.getFullYear(),
      mes: p.mes !== undefined ? p.mes : (p.anio !== undefined ? '' : hoy.getMonth() + 1),
      estado_datos: p.estado_datos || '', op: p.op || '', estado: p.estado || '', categoria: p.categoria || '',
      texto: p.texto || '', pagina: Number(p.pagina) || 1, por_pagina: 100
    };
    const cats = App.estado.catalogos.categorias.map((c) => c.nombre);
    cont.innerHTML = `
      <div class="flex flex-wrap items-center gap-2 mb-3">
        <h1 class="titulo-pagina mr-auto">Pagos y Órdenes de Pago</h1>
        ${App.puede('pagos.importar') ? `<a class="btn" href="#/importar">${ico('file-up')} Importar conciliación</a>` : ''}

      </div>
      <div class="tarjeta p-3 mb-3 flex flex-wrap gap-2 items-center">
        ${ui.selectorPeriodo(filtros.anio, filtros.mes)}
        <select id="f-datos" class="campo" style="width:auto" aria-label="Estado de los datos">${ui.opciones([{ valor: 'POR_COMPLETAR', texto: 'Por completar' }, { valor: 'COMPLETO', texto: 'Completos' }], filtros.estado_datos, 'Datos: todos')}</select>
        <select id="f-op" class="campo" style="width:auto" aria-label="Orden de pago">${ui.opciones([{ valor: 'PENDIENTE', texto: 'OP pendiente' }, { valor: 'BORRADOR', texto: 'Con borrador en curso' }, { valor: 'GENERADA', texto: 'OP generada' }], filtros.op, 'OP: todas')}</select>
        <select id="f-estado" class="campo" style="width:auto" aria-label="Estado">${ui.opciones([{ valor: 'ACTIVA', texto: 'Activas' }, { valor: 'ANULADA', texto: 'Anuladas' }], filtros.estado, 'Estado: todos')}</select>
        <select id="f-cat" class="campo" style="width:auto;max-width:220px" aria-label="Categoría">${ui.opciones(cats, filtros.categoria, 'Todas las categorías')}</select>
        <div class="relative flex-1 min-w-[200px]"><label class="sr-only" for="f-texto">Buscar</label>
          <input id="f-texto" class="campo" placeholder="Buscar N°, beneficiario, cédula/RIF, descripción…" value="${esc(filtros.texto)}"></div>
      </div>
      <div id="resumen" class="flex flex-wrap gap-2 mb-3"></div>
      <div class="tarjeta"><div id="tabla" class="tabla-env"><div class="suave p-6">Cargando…</div></div><div id="pag"></div></div>`;

    const aplicar = (cambios = {}) => {
      const f = Object.assign({}, filtros, {
        anio: $('#f-anio').value, mes: $('#f-mes').value, estado_datos: $('#f-datos').value, op: $('#f-op').value,
        estado: $('#f-estado').value, categoria: $('#f-cat').value, texto: $('#f-texto').value.trim(), pagina: 1
      }, cambios);
      const q = new URLSearchParams();
      Object.keys(f).forEach((k) => { if (k !== 'por_pagina') q.set(k, f[k]); });
      history.replaceState(null, '', '#/pagos?' + q.toString());
      Object.assign(filtros, f);
      cargar();
    };
    ['#f-anio', '#f-mes', '#f-datos', '#f-op', '#f-estado', '#f-cat'].forEach((s) => $(s).addEventListener('change', () => aplicar()));
    $('#f-texto').addEventListener('input', demorar(() => aplicar(), 450));

    async function cargar() {
      const tabla = $('#tabla');
      tabla.innerHTML = '<div class="suave p-6">Cargando…</div>';
      try {
        const r = await api('pagos.listar', filtros);
        $('#resumen').innerHTML = `
          <span class="pill pill-info">Total: ${fmt.bs(r.totales.monto)} · ${fmt.usd(r.totales.monto_usd)}</span>
          <span class="pill pill-aviso">${r.totales.por_completar} por completar</span>
          <span class="pill pill-neutro">${r.totales.op_pendientes} OP pendientes</span>
          ${r.totales.op_borradores ? `<a class="pill pill-info" href="#/pagos?anio=${filtros.anio}&mes=${filtros.mes}&op=BORRADOR">${r.totales.op_borradores} con borrador en curso</a>` : ''}
          ${r.totales.anuladas ? `<span class="pill pill-peligro">${r.totales.anuladas} anuladas</span>` : ''}`;
        if (!r.registros.length) { tabla.innerHTML = '<div class="suave p-6">No hay pagos con esos filtros.</div>'; $('#pag').innerHTML = ''; return; }
        tabla.innerHTML = `<table class="tabla"><thead><tr><th>N°</th><th class="hidden md:table-cell">Fecha</th><th>Beneficiario</th><th class="hidden lg:table-cell">Categoría</th>
          <th class="num">Monto</th><th class="hidden md:table-cell">Estado</th><th class="hidden md:table-cell text-right">Acciones</th></tr></thead><tbody>
          ${r.registros.map((x) => `<tr class="${x.estado === 'ANULADA' ? 'anulada' : ''}">
            <td class="font-semibold">${x.numero}</td>
            <td class="hidden md:table-cell whitespace-nowrap">${fmt.fecha(x.fecha)}</td>
            <td><div class="font-medium">${esc(x.beneficiario || '— sin beneficiario —')}</div>
              <div class="suave text-xs">${esc(fmt.doc(x.tipo_doc, x.documento))}</div>
              ${x.descripcion ? `<div class="text-xs descripcion-pago">${esc(x.descripcion)}</div>` : ''}
              <div class="md:hidden mt-1 flex flex-wrap items-center gap-1"><span class="suave text-xs">${fmt.fecha(x.fecha)}</span> ${estadoPill(x)}</div>
              <div class="md:hidden acciones mt-1">${acciones(x)}</div></td>
            <td class="hidden lg:table-cell">${ui.pillCategoria(x.categoria)}</td>
            <td class="num whitespace-nowrap">${fmt.bs(x.monto)}<div class="suave text-xs">${fmt.usd(x.monto_usd)}</div></td>
            <td class="hidden md:table-cell">${estadoPill(x)}</td>
            <td class="hidden md:table-cell acciones text-right whitespace-nowrap">${acciones(x)}</td></tr>`).join('')}
          </tbody></table>`;
        $('#pag').replaceChildren(ui.paginacion(r.total, r.pagina, r.por_pagina, (n) => { filtros.pagina = n; cargar(); }));
        $$('[data-acc]', tabla).forEach((b) => b.addEventListener('click', () => ejecutar(b.dataset.acc, r.registros.find((x) => x.id === b.dataset.id), cargar)));
        ui.iconos();
      } catch (e) { tabla.innerHTML = `<div class="alerta alerta-peligro m-3">${esc(e.message)}</div>`; }
    }
    cargar();
  }

  function acciones(x) {
    const b = (acc, icono, titulo) => `<button class="btn btn-ico" data-acc="${acc}" data-id="${x.id}" title="${titulo}" aria-label="${titulo} N° ${x.numero}">${ico(icono)}</button>`;
    if (x.estado === 'ANULADA') return b('ver', 'eye', 'Ver orden') + (App.puede('admin') ? b('reactivar', 'rotate-ccw', 'Reactivar') : '');
    let h = '';
    if (App.puede('pagos.editar')) h += b('editar', x.estado_datos === 'POR_COMPLETAR' ? 'pencil-line' : 'pencil', x.estado_datos === 'POR_COMPLETAR' ? 'Completar datos' : 'Editar pago');
    if (App.puede('op.generar')) h += b('op', 'file-signature', 'Orden de pago (factura y retenciones)');
    h += b('ver', 'printer', 'Ver e imprimir');
    if (App.puede('oc.editar')) h += b('oc', 'clipboard-list', 'Crear orden de compra/servicio');
    if (App.puede('op.anular')) h += b('anular', 'ban', 'Anular');
    return h;
  }

  async function ejecutar(accion, x, recargar) {
    try {
      if (accion === 'editar') return editarPago(x.id, recargar);
      if (accion === 'op') return ordenPago(x.id, recargar);
      if (accion === 'ver') return verOrden(x.id, recargar);
      if (accion === 'oc') { location.hash = `#/ordenes?desdePago=${x.id}`; return null; }
      if (accion === 'anular') {
        const motivo = await ui.confirmar({ titulo: `Anular Orden de Pago N° ${x.numero}`, mensaje: 'La orden quedará anulada (no se borra). Podrá reactivarla un administrador.', textoBoton: 'Anular', peligro: true, pedirMotivo: true });
        if (!motivo) return null;
        await api('pagos.anular', { id: x.id, motivo }, { escritura: true });
        ui.toast(`Orden N° ${x.numero} anulada.`, 'exito');
        return recargar();
      }
      if (accion === 'reactivar') {
        const motivo = await ui.confirmar({ titulo: `Reactivar Orden N° ${x.numero}`, mensaje: 'La orden volverá a estar activa.', textoBoton: 'Reactivar', pedirMotivo: true });
        if (!motivo) return null;
        await api('pagos.reactivar', { id: x.id, motivo }, { escritura: true });
        ui.toast(`Orden N° ${x.numero} reactivada.`, 'exito');
        return recargar();
      }
    } catch (e) { ui.error(e); }
    return null;
  }

  /* ---------- Editar / completar / pago manual ---------- */
  async function editarPago(id, recargar) {
    const datos = id ? await api('pagos.obtener', { id }) : { pago: { fecha: fmt.hoy() }, faltan: [] };
    const p = datos.pago;
    const esAdmin = App.puede('admin');
    const nuevo = !id;
    const cats = App.estado.catalogos.categorias.map((c) => c.nombre);
    const m = ui.modal({
      titulo: nuevo ? 'Registrar pago manual' : `Pago N° ${p.numero}`,
      tamano: 'mediano',
      cuerpo: `
        ${!nuevo && datos.faltan.length ? `<div class="alerta alerta-aviso mb-3">Falta: ${esc(datos.faltan.join(', '))}.</div>` : ''}
        ${p.referencia_banco ? `<p class="suave text-xs mb-3">Banco: ${esc(p.referencia_banco)}</p>` : ''}
        <form id="form-pago" class="grid grid-cols-1 sm:grid-cols-6 gap-3" novalidate>
          <div class="sm:col-span-2"><label class="etiqueta" for="p-fecha">Fecha del pago</label>
            <input id="p-fecha" type="date" class="campo" value="${esc(p.fecha || '')}" ${nuevo || esAdmin ? '' : 'readonly'} required></div>
          <div class="sm:col-span-2"><label class="etiqueta" for="p-monto">Monto pagado (Bs.)</label>
            <input id="p-monto" class="campo num" inputmode="decimal" value="${p.monto ? esc(fmt.num(p.monto)) : ''}" ${nuevo || (esAdmin && p.origen === 'MANUAL') ? '' : 'readonly'} required>
            ${!nuevo && p.origen !== 'MANUAL' ? '<p class="ayuda">Viene del banco: no se modifica. Si está mal, anule el pago.</p>' : ''}</div>
          <div class="sm:col-span-2"><label class="etiqueta" for="p-numero">N° de orden</label>
            <input id="p-numero" class="campo" inputmode="numeric" value="${esc(p.numero || '')}" ${nuevo && esAdmin ? 'placeholder="Automático"' : 'readonly'}></div>
          <div class="sm:col-span-6"><label class="etiqueta" for="p-ben">Beneficiario o proveedor</label>
            <input id="p-ben" class="campo" value="${esc(p.beneficiario || '')}" placeholder="Escriba nombre o cédula/RIF para buscar en el registro" maxlength="200"></div>
          <div class="sm:col-span-1"><label class="etiqueta" for="p-tipo">Tipo</label>
            <select id="p-tipo" class="campo">${ui.opciones(['V', 'E', 'J', 'G', 'P'], p.tipo_doc, '—')}</select></div>
          <div class="sm:col-span-2"><label class="etiqueta" for="p-doc">Cédula / RIF</label>
            <input id="p-doc" class="campo" inputmode="numeric" value="${esc(p.documento || '')}"><p id="p-doc-ayuda" class="ayuda"></p></div>
          <div class="sm:col-span-3"><label class="etiqueta" for="p-cuenta">Cuenta bancaria del beneficiario</label>
            <input id="p-cuenta" class="campo" inputmode="numeric" value="${esc(p.cuenta || '')}" placeholder="0102-0000-0000-0000-0000"><p id="p-cuenta-ayuda" class="ayuda"></p></div>
          <div class="sm:col-span-3"><label class="etiqueta" for="p-cat">Categoría</label>
            <select id="p-cat" class="campo">${ui.opciones(cats, p.categoria, 'Seleccione…')}</select></div>
          <div class="sm:col-span-3 flex items-end"><p class="suave text-sm">${p.tasa_bcv ? `Tasa BCV ${fmt.num(p.tasa_bcv, 2)} · ${fmt.usd(p.monto_usd)}` : 'La tasa BCV se asigna según la fecha.'}</p></div>
          <div class="sm:col-span-6"><label class="etiqueta" for="p-desc">Descripción / motivo del pago</label>
            <textarea id="p-desc" class="campo" maxlength="1000">${esc(p.descripcion || '')}</textarea></div>
        </form>`,
      pie: `<button class="btn" data-cerrar>Cancelar</button>
        ${!nuevo && App.puede('pagos.editar') ? `<button class="btn" id="btn-tasa" title="Recalcular la tasa BCV según la fecha">${ico('refresh-cw')} Tasa</button>` : ''}
        <button class="btn btn-prim" id="btn-guardar">${ico('save')} Guardar</button>`
    });
    const el = m.el;
    const revisarCuenta = ui.validarCuenta($('#p-cuenta', el), $('#p-cuenta-ayuda', el));
    const revisarDoc = ui.validarDocumento($('#p-tipo', el), $('#p-doc', el), $('#p-doc-ayuda', el));
    const usarBeneficiario = (b) => {
      $('#p-ben', el).value = b.nombre;
      $('#p-tipo', el).value = b.tipo_doc;
      $('#p-doc', el).value = b.documento;
      if (b.cuenta && (nuevo || !$('#p-cuenta', el).value)) $('#p-cuenta', el).value = b.cuenta;
      if (b.categoria_sugerida && !$('#p-cat', el).value) $('#p-cat', el).value = b.categoria_sugerida;
      revisarCuenta();
      revisarDoc();
      if (b.problemas && b.problemas.length) ui.toast(`Revise los datos de ${b.nombre}: ${b.problemas.join(' · ')}`, 'aviso', 8000);
    };
    ui.autocompletarBeneficiario($('#p-ben', el), usarBeneficiario);
    // Si escriben primero la cédula/RIF, se buscan los demás datos en el registro.
    $('#p-doc', el).addEventListener('blur', async () => {
      const doc = $('#p-doc', el).value.replace(/\D/g, '');
      if (doc.length < 5 || $('#p-ben', el).value.trim()) return;
      try {
        const r = await api('beneficiarios.buscar', { texto: doc }, { silencioso: true });
        const t = $('#p-tipo', el).value;
        const candidatos = r.filter((b) => !t || b.tipo_doc === t);
        if (candidatos.length === 1) { usarBeneficiario(candidatos[0]); ui.toast(`Datos de ${candidatos[0].nombre} cargados del registro.`, 'info'); }
      } catch (e) { /* la búsqueda es solo una ayuda */ }
    });
    if ($('#btn-tasa', el)) {
      $('#btn-tasa', el).addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        ui.ocupado(btn, true);
        try { const r = await api('pagos.recalcularTasa', { id }, { escritura: true }); ui.toast(`Tasa aplicada: ${fmt.num(r.tasa_bcv, 2)} Bs. (${fmt.usd(r.monto_usd)})`, 'exito'); } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
      });
    }
    $('#btn-guardar', el).addEventListener('click', async (ev) => {
      if (!revisarCuenta()) { $('#p-cuenta', el).focus(); return; }
      const datosForm = {
        id, beneficiario: $('#p-ben', el).value, tipo_doc: $('#p-tipo', el).value, documento: $('#p-doc', el).value,
        cuenta: $('#p-cuenta', el).value, categoria: $('#p-cat', el).value, descripcion: $('#p-desc', el).value
      };
      if (nuevo || esAdmin) datosForm.fecha = $('#p-fecha', el).value;
      if (nuevo || (esAdmin && p.origen === 'MANUAL')) datosForm.monto = fmt.aNumero($('#p-monto', el).value);
      if (nuevo && $('#p-numero', el).value.trim()) datosForm.numero = Number($('#p-numero', el).value);
      const btn = ev.currentTarget;
      ui.ocupado(btn, true);
      try {
        const r = await api(nuevo ? 'pagos.crear' : 'pagos.guardar', datosForm, { escritura: true });
        m.cerrar();
        ui.toast(r.faltan.length ? `Guardado. Aún falta: ${r.faltan.join(', ')}.` : `Pago N° ${r.pago.numero} completo. Ya puede generar la Orden de Pago.`, r.faltan.length ? 'aviso' : 'exito');
        if (r.op_desactualizada) ui.toast('Esta orden ya tenía PDF. Regenérelo para que refleje los cambios.', 'aviso', 8000);
        if (recargar) recargar();
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    });
  }

  /* ---------- Orden de Pago: factura, retenciones, imputación ---------- */

  /** ¿Lleva factura? Lo guardado manda; si no hay nada, se deduce de la categoría y del tipo de documento. */
  function conFacturaInicial(p, cat) {
    if (p.op_borrador_en || p.op_generada || p.op_calculo) return p.op_con_factura === true || Number(p.op_base_imponible) > 0;
    const sinFactura = cat.categorias_sin_factura || [];
    if (p.categoria && sinFactura.includes(p.categoria)) return false;
    if (p.tipo_doc === 'J') return true;
    return !!p.categoria && p.tipo_doc !== 'G' && !/Vi[aá]ticos/i.test(p.categoria);
  }

  function retencionesOrdenadas(cat) {
    const orden = cat.orden_retenciones || [];
    const pos = (c) => (orden.indexOf(c) === -1 ? orden.length : orden.indexOf(c));
    return cat.retenciones.filter((r) => !r.fila_titulo && r.codigo !== 'FONDO_NEGRO')
      .map((r, i) => ({ r, i })).sort((a, b) => (pos(a.r.codigo) - pos(b.r.codigo)) || (a.i - b.i)).map((x) => x.r);
  }

  async function ordenPago(id, recargar) {
    const { pago: p, faltan, orden_vinculada: ov } = await api('pagos.obtener', { id });
    const cat = App.estado.catalogos;
    const umbral = Number(cat.umbral_fondo_negro) || 100000;
    const tol = Number(cat.tolerancia_diferencia) >= 0 ? Number(cat.tolerancia_diferencia) : 1;
    const fondoNegro = cat.retenciones.find((r) => r.codigo === 'FONDO_NEGRO');
    const guardado = borrador.leer('op:' + id);
    const inicial = guardado || {
      con_factura: conFacturaInicial(p, cat),
      factura: p.op_factura || '', base_imponible: p.op_base_imponible ? fmt.num(p.op_base_imponible) : '',
      retenciones: (p.op_retenciones || []).filter((c) => c !== 'FONDO_NEGRO'), contrato: p.op_contrato || '', orden_compra_id: p.orden_compra_id || '',
      imputacion: p.op_imputacion || { fecha: '', lineas: [] },
      estimada: p.op_estimada === true
    };
    if (inicial.con_factura === undefined) inicial.con_factura = conFacturaInicial(p, cat);
    let ordenes = [];
    try { ordenes = (await api('oc.listar', { texto: p.documento || p.beneficiario || '', estado: 'ACTIVA', por_pagina: 100 })).registros; } catch (e) { ordenes = []; }
    if (ov && !ordenes.some((o) => o.id === ov.id)) ordenes.unshift(Object.assign({}, ov, { beneficiario: p.beneficiario }));
    const lineas = [0, 1, 2].map((i) => (inicial.imputacion.lineas || [])[i] || {});
    const campoLinea = (i, k, ph, w) => `<input class="campo" data-l="${i}" data-k="${k}" value="${esc(lineas[i][k] || '')}" placeholder="${ph}" aria-label="${ph} línea ${i + 1}" style="min-width:${w || 52}px">`;
    const deBase = (r) => ({ BASE: 'de la base', IVA: 'del IVA', TOTAL: 'del total' })[r.base] || r.base;
    const m = ui.modal({
      titulo: `Orden de Pago N° ${p.numero} · ${esc(p.beneficiario || '')}`,
      tamano: 'grande',
      cuerpo: `
        ${faltan.length ? `<div class="alerta alerta-aviso mb-3">Antes de generar la orden complete: ${esc(faltan.join(', '))}.</div>` : ''}
        ${guardado ? '<div class="alerta alerta-info mb-3">Se recuperó lo que estaba escribiendo en este equipo y no se había guardado.</div>'
          : (p.op_borrador_en && !p.op_generada ? `<div class="alerta alerta-info mb-3">Borrador guardado el ${fmt.fechaHora(p.op_borrador_en)}. Revise y genere la orden cuando cuadre.</div>` : '')}
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
          <form id="form-op" class="lg:col-span-3 space-y-4" novalidate>
            <fieldset>
              <legend class="font-semibold mb-2">Factura</legend>
              <label class="check mb-1"><input type="checkbox" id="op-confac" ${inicial.con_factura ? 'checked' : ''}>
                <span><strong>Este pago tiene factura</strong> (empresa o firma personal)</span></label>
              <p class="suave text-xs mb-3">Desmarque para pagos a particulares, ayudas, subvenciones, dozavos, créditos adicionales o nómina: no llevan factura, IVA ni retenciones.</p>
              <div id="op-bloque-factura" class="space-y-4">
                <div class="flex flex-wrap items-center gap-2">
                  <button type="button" class="btn btn-chico" id="op-sugerir">${ico('folder-search')} No tengo el expediente</button>
                  <span class="suave text-xs">Propone la factura y las retenciones que dan exactamente lo pagado.</span>
                </div>
                <label class="check alerta alerta-aviso" id="op-estimada-l" ${inicial.estimada ? '' : 'hidden'}><input type="checkbox" id="op-estimada" ${inicial.estimada ? 'checked' : ''}>
                  <span><strong>Datos estimados sin expediente físico.</strong> Desmárquelo cuando los verifique con la factura.</span></label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div><label class="etiqueta" for="op-fac">N° de factura</label><input id="op-fac" class="campo" maxlength="40" value="${esc(inicial.factura)}"></div>
                  <div><label class="etiqueta" for="op-base">Base imponible (Bs.)</label><input id="op-base" class="campo num" inputmode="decimal" value="${esc(inicial.base_imponible)}"></div>
                  <div><label class="etiqueta" for="op-iva">IVA</label><input id="op-iva" class="campo" readonly value="${fmt.num(cat.iva_pct, 0)}%"></div>
                </div>
                <div>
                  <p class="font-semibold mb-2">Retenciones aplicables</p>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2" id="op-rets">
                    ${retencionesOrdenadas(cat).map((r) => `<label class="check"><input type="checkbox" value="${r.codigo}" ${inicial.retenciones.includes(r.codigo) ? 'checked' : ''}>
                      <span>${esc(r.nombre)} <span class="suave text-xs">(${fmt.num(r.porcentaje, r.porcentaje % 1 ? 2 : 0)}% ${deBase(r)})</span></span></label>`).join('')}
                  </div>
                  ${fondoNegro ? `<p class="text-sm mt-3" id="op-fn"></p>` : ''}
                </div>
              </div>
            </fieldset>
            <fieldset class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <legend class="font-semibold mb-2">Contrato y orden de compra/servicio</legend>
              <div><label class="etiqueta" for="op-con">Contrato N°</label><input id="op-con" class="campo" maxlength="60" value="${esc(inicial.contrato)}"></div>
              <div><label class="etiqueta" for="op-oc">Orden de compra/servicio vinculada</label>
                <select id="op-oc" class="campo">${ui.opciones(ordenes.map((o) => ({ valor: o.id, texto: `${o.tipo === 'COMPRA' ? 'OC' : 'OS'} N° ${o.numero} · ${fmt.bs(o.total_final)}` })), inicial.orden_compra_id, 'Ninguna')}</select></div>
            </fieldset>
            <details ${(inicial.imputacion.lineas || []).some((l) => l.partida) ? 'open' : ''}>
              <summary class="font-semibold cursor-pointer">Imputación presupuestaria (opcional)</summary>
              <div class="mt-2 mb-2 w-48"><label class="etiqueta" for="op-fimp">Fecha de imputación</label><input id="op-fimp" type="date" class="campo" value="${esc(inicial.imputacion.fecha || '')}"></div>
              <div class="tabla-env"><table class="tabla"><thead><tr><th>Sector</th><th>Prog</th><th>Act.</th><th>Partida</th><th>Gen.</th><th>Esp.</th><th>Sub-esp.</th><th>Total</th><th>Período</th></tr></thead><tbody>
                ${[0, 1, 2].map((i) => `<tr>${['sector', 'programa', 'actividad', 'partida', 'generica', 'especifica', 'subespecifica'].map((k) => `<td>${campoLinea(i, k, k.slice(0, 4))}</td>`).join('')}
                  <td>${campoLinea(i, 'total', 'Bs.', 90)}</td><td>${campoLinea(i, 'periodo', 'Período', 80)}</td></tr>`).join('')}
              </tbody></table></div>
            </details>
          </form>
          <aside class="lg:col-span-2"><div class="tarjeta p-4 sticky top-2" id="op-calculo" aria-live="polite"></div></aside>
        </div>`,
      pie: `<span class="suave text-xs mr-auto" id="op-motivo"></span>
        <button class="btn" data-cerrar>Cerrar</button>
        <button class="btn" id="op-guardar" title="Guarda lo escrito aunque todavía no cuadre">${ico('save')} Guardar borrador</button>
        <button class="btn btn-prim" id="op-pdf">${ico('file-check')} Generar orden de pago</button>`
    });
    const el = m.el;
    const conFactura = () => $('#op-confac', el).checked;
    const leer = () => ({
      id, con_factura: conFactura(), estimada: conFactura() && $('#op-estimada', el).checked,
      factura: conFactura() ? $('#op-fac', el).value.trim() : '',
      base_imponible: conFactura() ? fmt.aNumero($('#op-base', el).value) : null,
      retenciones: conFactura() ? $$('#op-rets input[type=checkbox]:checked', el).map((c) => c.value) : [],
      contrato: $('#op-con', el).value.trim(), orden_compra_id: $('#op-oc', el).value,
      imputacion: {
        fecha: $('#op-fimp', el).value,
        lineas: [0, 1, 2].map((i) => {
          const l = {};
          $$(`[data-l="${i}"]`, el).forEach((c) => { l[c.dataset.k] = c.dataset.k === 'total' ? fmt.aNumero(c.value) : c.value.trim(); });
          return l;
        }).filter((l) => Object.values(l).some((v) => v))
      }
    });
    /** Devuelve el motivo por el que no se puede generar, o '' si se puede. */
    const motivoBloqueo = (k) => {
      if (faltan.length) return `Complete primero: ${faltan.join(', ')}.`;
      if (k.conFactura && !(k.base > 0)) return 'Indique la base imponible, o desmarque "tiene factura".';
      if (k.conFactura && Math.abs(k.diferencia) > tol) return `El neto no cuadra con lo pagado (diferencia ${fmt.bs(k.diferencia)}).`;
      return '';
    };
    const pintar = () => {
      const d = leer();
      $('#op-bloque-factura', el).hidden = !d.con_factura;
      borrador.guardar('op:' + id, Object.assign({}, d, { base_imponible: $('#op-base', el).value, retenciones: $$('#op-rets input[type=checkbox]:checked', el).map((c) => c.value) }));
      const k = calcularOP({ con_factura: d.con_factura, base_imponible: d.base_imponible, retenciones: d.retenciones }, cat.retenciones, cat.iva_pct, p.monto, umbral);
      if ($('#op-fn', el)) {
        $('#op-fn', el).innerHTML = `${k.fondoNegro ? '<span class="pill pill-info">Se aplica</span>' : '<span class="pill pill-neutro">No aplica</span>'}
          <strong>${esc(fondoNegro.nombre)}</strong> <span class="suave text-xs">(${fmt.num(fondoNegro.porcentaje, 0)}% del total) · automático cuando el total de la factura pasa de ${fmt.bs(umbral)}</span>`;
      }
      const fila = (t, v, fuerte) => `<div class="flex justify-between gap-2 py-1 ${fuerte ? 'font-semibold' : ''}"><span>${t}</span><span class="num whitespace-nowrap">${v}</span></div>`;
      const cuadra = k.base > 0 && Math.abs(k.diferencia) <= tol;
      $('#op-calculo', el).innerHTML = `
        <h3 class="font-semibold mb-2">Desglose</h3>
        ${fila('Monto pagado (banco)', fmt.bs(p.monto), true)}
        <div class="separador my-2"></div>
        ${!k.conFactura ? '<p class="text-sm">Sin factura: la orden se emite por el monto pagado, sin IVA ni retenciones.</p><div class="alerta alerta-ok mt-2">Lista para generar.</div>'
          : k.base > 0 ? `${fila('Sub-total', fmt.bs(k.base))}${fila(`IVA ${fmt.num(cat.iva_pct, 0)}%`, fmt.bs(k.iva))}${fila('Total factura', fmt.bs(k.total), true)}
          <div class="separador my-2"></div>
          ${k.filas.filter((f) => f.seleccionada).map((f) => fila(`− ${esc(f.nombre)}`, fmt.bs(f.valor_retencion))).join('') || '<p class="suave text-sm">Sin retenciones.</p>'}
          ${fila('Total retenciones', fmt.bs(k.totalRet), true)}
          ${fila('Monto a pagar a la empresa', fmt.bs(k.empresa), true)}
          ${fila('Monto restante del IVA', fmt.bs(k.restanteIva))}
          ${cuadra ? `<div class="alerta alerta-ok mt-2">El neto coincide con lo pagado${k.diferencia ? ` (diferencia de ${fmt.bs(k.diferencia)} por redondeo)` : ''}.</div>`
            : `<div class="alerta alerta-peligro mt-2"><strong>No cuadra:</strong> el neto difiere de lo pagado en ${fmt.bs(k.diferencia)}. La orden no se puede generar hasta que coincida; puede guardarla como borrador.</div>`}`
          : '<p class="suave text-sm">Escriba la base imponible de la factura o use "Calcular base desde lo pagado".</p>'}
        <p class="suave text-xs mt-3">Tasa BCV ${p.tasa_bcv ? fmt.num(p.tasa_bcv, 2) : '—'} · ${fmt.usd(p.monto_usd)}</p>`;
      const motivo = motivoBloqueo(k);
      $('#op-pdf', el).disabled = !!motivo;
      $('#op-pdf', el).title = motivo || 'Genera el PDF y lo guarda en Drive';
      $('#op-motivo', el).textContent = motivo;
    };
    $('#form-op', el).addEventListener('input', demorar(pintar, 150));
    $('#form-op', el).addEventListener('change', pintar);
    $('#op-sugerir', el).addEventListener('click', () => sugerirSinExpediente(id, p, (g) => {
      $('#op-confac', el).checked = true;
      $('#op-base', el).value = fmt.num(g.base_imponible);
      $$('#op-rets input[type=checkbox]', el).forEach((c) => { c.checked = g.retenciones.includes(c.value); });
      $('#op-estimada-l', el).hidden = false;
      $('#op-estimada', el).checked = true;
      pintar();
      ui.toast('Datos estimados cargados: el neto cuadra con lo pagado. Confírmelos con el expediente cuando lo tenga.', 'info', 8000);
    }));
    pintar();
    const guardar = async (ev, generar) => {
      const btn = ev.currentTarget;
      ui.ocupado(btn, true);
      try {
        const r = await api('op.guardar', Object.assign(leer(), { generar_pdf: generar }), { escritura: true });
        borrador.borrar('op:' + id);
        m.cerrar();
        if (recargar) recargar();
        if (!generar) {
          ui.toast(r.aviso ? `Borrador guardado. ${r.aviso}` : 'Borrador guardado. Ya puede generar la orden cuando quiera.', r.aviso ? 'aviso' : 'exito', r.aviso ? 9000 : 4000);
          return;
        }
        ui.toast(`Orden N° ${p.numero} generada y guardada en Drive.`, 'exito');
        ui.documento({ titulo: `Orden de Pago N° ${p.numero}`, html: r.html, pdfUrl: r.pdf_url || r.pago.op_pdf_url, generarPdf: App.puede('op.generar') ? () => api('op.pdf', { id }, { escritura: true }) : null });
      } catch (e) { ui.error(e); } finally { ui.ocupado(btn, false); }
    };
    $('#op-guardar', el).addEventListener('click', (ev) => guardar(ev, false));
    $('#op-pdf', el).addEventListener('click', (ev) => guardar(ev, true));
  }

  /** Combinaciones de factura y retenciones que dan exactamente lo pagado (cuando no se tiene el expediente). */
  async function sugerirSinExpediente(id, p, alElegir) {
    let r;
    try { r = await api('op.sugerir', { id }, { mensaje: 'Buscando combinaciones que cuadren…' }); } catch (e) { ui.error(e); return; }
    const celda = (t, v) => `<div><div class="suave text-xs">${t}</div><div class="font-semibold num">${v}</div></div>`;
    const m = ui.modal({
      titulo: 'Sugerencias sin expediente',
      tamano: 'mediano',
      cuerpo: `
        <p class="text-sm mb-3">Con lo pagado (<strong>${fmt.bs(r.monto_pagado)}</strong>) se buscó qué factura y retenciones dan <strong>exactamente</strong> ese neto.
          Retenciones fijas: ${esc(r.fijas.join(', '))}. El Fondo Negro Primero (Resp. Social) se aplica solo si el total pasa de ${fmt.bs(r.umbral_fondo_negro)}.</p>
        <div class="alerta alerta-aviso text-sm mb-3">Es una estimación: puede haber más de una combinación posible. Elija la que corresponda al tipo de proveedor y verifíquela con el expediente cuando lo tenga.</div>
        ${r.sugerencias.length ? `<div class="space-y-3">${r.sugerencias.map((g, i) => `<div class="sugerencia-op ${g.exacta ? 'exacta' : ''}">
            <div class="flex flex-wrap items-center gap-2 mb-1"><strong class="mr-auto">${i + 1}. ${esc(g.nombre)}</strong>
              ${g.exacta ? '<span class="pill pill-ok">Cuadra exacto</span>' : `<span class="pill pill-aviso">Diferencia ${fmt.bs(g.diferencia)}</span>`}

      pie: '<button class="btn" data-cerrar>Cerrar</button>'
    });
    $$('[data-usar]', m.el).forEach((b) => b.addEventListener('click', () => { const g = r.sugerencias[Number(b.dataset.usar)]; m.cerrar(); alElegir(g); }));
    ui.iconos();
  }

  async function verOrden(id, recargar) {
    try {
      const v = await api('op.vista', { id });
      ui.documento({
        titulo: v.titulo, html: v.html, pdfUrl: v.pdf_url,
        aviso: v.faltan.length ? `Datos incompletos: ${esc(v.faltan.join(', '))}. No imprima hasta completarlos.` : (v.descuadre ? esc(v.descuadre) : ''),

      });
    } catch (e) { ui.error(e); }
  }

  return { render, editarPago, ordenPago, verOrden, calcularOP };
})();

})();
